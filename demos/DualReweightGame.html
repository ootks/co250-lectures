<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive dual cost-reduction game for minimum cost perfect matching">
  <title>Dual Reweighting Game</title>
  <style>
    :root {
      color-scheme: light;
      --base3: #fdf6e3;
      --base2: #eee8d5;
      --base1: #93a1a1;
      --base00: #657b83;
      --base01: #586e75;
      --base02: #073642;
      --blue: #268bd2;
      --cyan: #2aa198;
      --green: #859900;
      --red: #dc322f;
      --yellow: #b58900;
      --orange: #cb4b16;
      --shadow: 0 18px 48px rgba(7, 54, 66, 0.09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--base3);
      color: var(--base01);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.72fr);
      gap: 18px;
      padding: 16px;
      height: 100%;
      align-items: stretch;
    }
    .card {
      border: 1px solid #d8d0bb;
      border-radius: 16px;
      background: rgba(255,255,255,.30);
      box-shadow: var(--shadow);
    }
    .graph-card { padding: 8px; position: relative; display: flex; align-items: center; justify-content: center; }
    svg { width: 100%; height: 100%; max-height: 100%; display: block; }

    .panel { padding: 14px 16px; overflow-y: auto; }
    .panel h2 {
      margin: 0 0 8px;
      color: var(--base02);
      font-size: .95rem;
      letter-spacing: -.01em;
    }
    .hint { color: var(--base00); font-size: .82rem; margin: 0 0 12px; }

    .readout {
      border: 1px solid #d8d0bb;
      border-radius: 10px;
      background: rgba(253,246,227,.65);
      padding: 8px 10px;
      margin-bottom: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--base02);
    }
    .readout .num { color: var(--green); font-variant-numeric: tabular-nums; font-weight: 700; }

    .mlist { display: grid; gap: 6px; }
    .mrow {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      border: 1px solid #d8d0bb;
      border-radius: 9px;
      padding: 7px 10px;
      background: rgba(253,246,227,.5);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .84rem;
    }
    .mrow .cost { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--base02); }

    .reset {
      margin-top: 12px;
      border: 1px solid #c7c0aa;
      border-radius: 9px;
      padding: 8px 12px;
      background: rgba(255,255,255,.5);
      color: var(--base01);
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }
    .reset:hover { border-color: var(--base1); }

    /* The y_v input boxes are positioned over the graph svg. */
    .yfield {
      position: absolute;
      width: 48px;
      font-size: 15px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
      border: 1.5px solid var(--blue);
      border-radius: 7px;
      background: var(--base3);
      color: var(--base02);
      padding: 2px 2px;
      transform: translate(-50%, -50%);
    }
    .yfield:focus { outline: 2px solid var(--cyan); }
    .ylabel {
      position: absolute;
      font-size: 12px;
      color: var(--blue);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card graph-card">
      <svg id="graph" viewBox="0 0 440 360" aria-label="Weighted bipartite graph with an editable dual value beside each vertex"></svg>
      <div id="overlay"></div>
    </div>
    <aside class="card panel">
      <h2>Reduce the costs</h2>
      <p class="hint">Type a value <b>y<sub>v</sub></b> in the box beside each vertex. Every edge touching that vertex has its displayed cost reduced by that amount. Each edge shows its current reduced cost.</p>
      <div class="readout">&#8721; y<sub>v</sub> = <span class="num" id="sumy">0</span></div>
      <h2>Perfect matchings</h2>
      <div class="mlist" id="matchings"></div>
      <div class="readout" style="margin-top:12px;">min matching cost drops by exactly &#8721; y<sub>v</sub></div>
      <button class="reset" id="reset" type="button">Reset all y to 0</button>
    </aside>
  </div>

  <script>
    const SVGNS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("graph");
    const overlay = document.getElementById("overlay");

    // A small weighted bipartite graph: parts {a, b, c} and {d, e, f}.
    const V = {
      a: { x: 120, y: 70,  side: "L", lx: -62, ly: 0 },
      b: { x: 120, y: 180, side: "L", lx: -62, ly: 0 },
      c: { x: 120, y: 290, side: "L", lx: -62, ly: 0 },
      d: { x: 320, y: 70,  side: "R", lx:  62, ly: 0 },
      e: { x: 320, y: 180, side: "R", lx:  62, ly: 0 },
      f: { x: 320, y: 290, side: "R", lx:  62, ly: 0 }
    };
    const R = 22;

    // Edges with base costs.
    const EDGES = [
      { a: "a", b: "d", c0: 6 },
      { a: "a", b: "e", c0: 4 },
      { a: "b", b: "d", c0: 3 },
      { a: "b", b: "f", c0: 7 },
      { a: "c", b: "e", c0: 5 },
      { a: "c", b: "f", c0: 2 }
    ];

    // The perfect matchings of this graph (each pairs {a,b,c} with {d,e,f}).
    // With edges a-d, a-e, b-d, b-f, c-e, c-f there are exactly two.
    const MATCHINGS = [
      ["a-d", "b-f", "c-e"],
      ["a-e", "b-d", "c-f"]
    ];

    function key(e) { return e.a + "-" + e.b; }

    // dual value for each vertex
    const y = {}; Object.keys(V).forEach(v => y[v] = 0);

    function el(name, attrs, parent) {
      const node = document.createElementNS(SVGNS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(node);
      return node;
    }
    function trim(from, to, r) {
      const dx = to.x - from.x, dy = to.y - from.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: from.x + dx / len * r, y: from.y + dy / len * r };
    }

    // reduced cost of an edge given current y
    function redCost(e) { return e.c0 - y[e.a] - y[e.b]; }

    // --- build edges and their cost labels ---
    // Each label sits ON its edge (centered on the line, with an opaque
    // background), so it is unambiguous which edge it belongs to.
    const costLabels = {};
    EDGES.forEach(e => {
      const A = V[e.a], B = V[e.b];
      const p1 = trim(A, B, R), p2 = trim(B, A, R);
      const line = el("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: "#93a1a1", "stroke-width": 3, "stroke-linecap": "round" }, svg);
      // horizontal edges are labelled at their midpoint; slanted edges nearer
      // their left endpoint, where edges leaving the same vertex are far apart
      const frac = (A.y === B.y) ? 0.5 : 0.25;
      const lx = p1.x + (p2.x - p1.x) * frac;
      const ly = p1.y + (p2.y - p1.y) * frac;
      const rect = el("circle", { cx: lx, cy: ly, r: 18,
        fill: "#fdf6e3", stroke: "#93a1a1", "stroke-width": 1.5 }, svg);
      const t = el("text", { x: lx, y: ly + 5, "text-anchor": "middle",
        "font-size": 15, "font-family": "ui-monospace, Menlo, monospace", fill: "#073642" }, svg);
      costLabels[key(e)] = { text: t, rect, line };
    });

    // --- build vertices ---
    for (const id in V) {
      const p = V[id];
      const fill = p.side === "L" ? "#268bd2" : "#b58900";
      const stroke = p.side === "L" ? "#0d5a8a" : "#7a5c00";
      el("circle", { cx: p.x, cy: p.y, r: R, fill, stroke, "stroke-width": 2 }, svg);
      const t = el("text", { x: p.x, y: p.y + 6, "text-anchor": "middle",
        "font-size": 18, "font-style": "italic", "font-family": "Georgia, serif", fill: "white" }, svg);
      t.textContent = id;
    }

    // --- overlay the y_v inputs, positioned from the svg coordinates ---
    // We convert svg viewBox coords to overlay pixels using the rendered size.
    const vb = { w: 440, h: 360 };
    const fields = {};
    for (const id in V) {
      const p = V[id];
      const label = document.createElement("span");
      label.className = "ylabel";
      label.innerHTML = "y<sub>" + id + "</sub>";
      overlay.appendChild(label);

      const input = document.createElement("input");
      input.className = "yfield";
      input.type = "number";
      input.step = "1";
      input.value = "0";
      input.setAttribute("aria-label", "y value for vertex " + id);
      input.addEventListener("input", () => {
        const val = parseFloat(input.value);
        y[id] = isFinite(val) ? val : 0;
        render();
      });
      overlay.appendChild(input);
      fields[id] = { input, label, p };
    }

    function placeFields() {
      const rect = svg.getBoundingClientRect();
      const host = svg.parentElement.getBoundingClientRect();
      const sx = rect.width / vb.w, sy = rect.height / vb.h;
      const offx = rect.left - host.left, offy = rect.top - host.top;
      for (const id in fields) {
        const { input, label, p } = fields[id];
        // field sits just outside the vertex, on the far side from the graph
        const fx = offx + (p.x + (p.side === "L" ? -58 : 58)) * sx;
        const fy = offy + p.y * sy;
        input.style.left = fx + "px";
        input.style.top = fy + "px";
        // label sits above the field
        label.style.left = fx + "px";
        label.style.top = (fy - 22) + "px";
      }
    }

    const matchingsBox = document.getElementById("matchings");
    const sumyEl = document.getElementById("sumy");

    function matchingValid(m) {
      // only keep matchings all of whose edges exist in the graph
      return m.every(k => costLabels[k]);
    }

    function render() {
      // edge cost labels
      EDGES.forEach(e => {
        const rc = redCost(e);
        const lab = costLabels[key(e)];
        lab.text.textContent = rc;
        // color: negative reduced cost in orange to flag it
        // zero reduced cost: the edge turns green
        const zero = Math.abs(rc) < 1e-9;
        lab.text.setAttribute("fill", rc < 0 ? "#cb4b16" : zero ? "#859900" : "#073642");
        lab.rect.setAttribute("stroke", rc < 0 ? "#cb4b16" : zero ? "#859900" : "#93a1a1");
        lab.line.setAttribute("stroke", zero ? "#859900" : "#93a1a1");
        lab.line.setAttribute("stroke-width", zero ? 5 : 3);
      });

      const sumY = Object.values(y).reduce((s, v) => s + v, 0);
      sumyEl.textContent = +sumY.toFixed(2);

      // perfect-matching costs
      matchingsBox.innerHTML = "";
      MATCHINGS.filter(matchingValid).forEach(m => {
        const base = m.reduce((s, k) => {
          const e = EDGES.find(x => key(x) === k);
          return s + e.c0;
        }, 0);
        const reduced = m.reduce((s, k) => {
          const e = EDGES.find(x => key(x) === k);
          return s + redCost(e);
        }, 0);
        const row = document.createElement("div");
        row.className = "mrow";
        row.innerHTML =
          `<span>{ ${m.join(", ")} }</span>` +
          `<span class="cost">${+reduced.toFixed(2)}</span>`;
        row.title = "base cost " + base + " minus \u03a3 y = " + +sumY.toFixed(2);
        matchingsBox.appendChild(row);
      });
    }

    document.getElementById("reset").addEventListener("click", () => {
      for (const id in V) { y[id] = 0; fields[id].input.value = "0"; }
      render();
    });

    window.addEventListener("resize", placeFields);
    // place after layout settles
    requestAnimationFrame(() => { placeFields(); render(); });
    render();
  </script>
</body>
</html>
