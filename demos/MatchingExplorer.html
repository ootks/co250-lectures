<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive bipartite matching ILP demonstration">
  <title>Matching Explorer</title>
  <style>
    :root {
      color-scheme: light;
      --base3: #fdf6e3;
      --base2: #eee8d5;
      --base1: #93a1a1;
      --base00: #657b83;
      --base01: #586e75;
      --base02: #073642;
      --blue: #268bd2;
      --green: #859900;
      --red: #dc322f;
      --yellow: #b58900;
      --shadow: 0 18px 48px rgba(7, 54, 66, 0.09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--base3);
      color: var(--base01);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.9fr);
      gap: 18px;
      padding: 16px;
      height: 100%;
      align-items: stretch;
    }
    .card {
      border: 1px solid #d8d0bb;
      border-radius: 16px;
      background: rgba(255,255,255,.30);
      box-shadow: var(--shadow);
    }
    .graph-card { padding: 8px; display: flex; align-items: center; justify-content: center; }
    svg { width: 100%; height: 100%; max-height: 100%; display: block; }

    .panel { padding: 14px 16px; overflow-y: auto; }
    .panel h2 {
      margin: 0 0 8px;
      color: var(--base02);
      font-size: .95rem;
      letter-spacing: -.01em;
    }
    .hint { color: var(--base00); font-size: .82rem; margin: 0 0 12px; }

    .objective {
      border: 1px solid #d8d0bb;
      border-radius: 10px;
      background: rgba(253,246,227,.65);
      padding: 8px 10px;
      margin-bottom: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--base02);
    }
    .objective b { color: var(--green); font-variant-numeric: tabular-nums; }

    .xvector {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--base02);
    }
    .xvec-label { font-weight: 700; }
    .xvec-bracket { font-size: 1.5rem; color: var(--base00); line-height: 1; }
    .xvec-entries { display: inline-flex; gap: 6px; }
    .xvec-entry {
      display: grid;
      justify-items: center;
      gap: 2px;
    }
    .xvec-entry .bit {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid #d8d0bb;
      border-radius: 7px;
      background: rgba(253,246,227,.65);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--base1);
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .xvec-entry.on .bit {
      background: var(--green);
      border-color: #556100;
      color: white;
    }
    .xvec-entry .sub { font-size: .62rem; color: var(--base00); }

    .con-list { display: grid; gap: 6px; }
    .con {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      border: 1px solid #d8d0bb;
      border-radius: 9px;
      padding: 7px 10px;
      background: rgba(253,246,227,.5);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .86rem;
      transition: background .15s ease, border-color .15s ease;
    }
    .con.ok { color: var(--base01); }
    .con.violated {
      background: rgba(220,50,47,.14);
      border-color: var(--red);
      color: #a5201d;
      font-weight: 600;
    }
    .con .tag {
      font-size: .74rem;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--base2);
      color: var(--base00);
    }
    .con.violated .tag { background: var(--red); color: white; }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--base02);
      color: var(--base3);
      font-size: .9rem;
    }
    .status.good { background: #14786f; }
    .status.bad { background: var(--red); }

    .reset {
      margin-top: 12px;
      border: 1px solid #c7c0aa;
      border-radius: 9px;
      padding: 8px 12px;
      background: rgba(255,255,255,.5);
      color: var(--base01);
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }
    .reset:hover { border-color: var(--base1); }

    /* SVG edge interactivity */
    .edge { cursor: pointer; }
    .edge-hit { stroke: transparent; stroke-width: 18; fill: none; }
    .edge-line { stroke: #93a1a1; stroke-width: 3; fill: none; transition: stroke .12s ease, stroke-width .12s ease; }
    .edge.selected .edge-line { stroke: var(--green); stroke-width: 6; }
    .edge:hover .edge-line { stroke: #6b7f00; }
    .edge.selected:hover .edge-line { stroke: #6b8f00; }
    .edge-var { font: 600 13px ui-monospace, Menlo, monospace; fill: #93a1a1; pointer-events: none; }
    .edge.selected .edge-var { fill: var(--green); }

    .vnode { transition: fill .12s ease, stroke .12s ease; }
    .vnode.bad { stroke: var(--red); stroke-width: 4; }
    .vlabel { font: 700 16px Inter, system-ui, sans-serif; fill: white; pointer-events: none; }

    @media (max-width: 760px) {
      .wrap { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card graph-card">
      <svg id="graph" viewBox="0 0 340 300" aria-label="Bipartite graph; click edges to toggle them in the matching"></svg>
    </div>
    <aside class="card panel">
      <h2>Build a matching</h2>
      <p class="hint">Click an edge to add or remove it from the matching. A variable $x_{ij}=1$ means edge $u_iv_j$ is chosen.</p>
      <div class="xvector">
        <span class="xvec-label">x =</span>
        <span class="xvec-bracket">(</span>
        <span class="xvec-entries" id="xvector"></span>
        <span class="xvec-bracket">)</span>
      </div>
      <div class="objective">objective = <b id="objective">0</b></div>
      <div class="con-list" id="constraints"></div>
      <div class="status" id="status">No edges selected.</div>
      <button class="reset" id="reset" type="button">Clear matching</button>
    </aside>
  </div>

  <script>
    // Same 3+3 instance as the concrete-example slide.
    // Vertices with positions (matching images/bipartite_matching_example.svg).
    const V = {
      u1: { x: 90,  y: 70,  side: "u" },
      u2: { x: 90,  y: 150, side: "u" },
      u3: { x: 90,  y: 230, side: "u" },
      v1: { x: 250, y: 70,  side: "v" },
      v2: { x: 250, y: 150, side: "v" },
      v3: { x: 250, y: 230, side: "v" }
    };
    const R = 22;

    // Edges: id, endpoints, variable label (x_{ij} where i is u-index, j is v-index).
    const EDGES = [
      { id: "u1v1", a: "u1", b: "v1", i: 1, j: 1 },
      { id: "u1v2", a: "u1", b: "v2", i: 1, j: 2 },
      { id: "u2v2", a: "u2", b: "v2", i: 2, j: 2 },
      { id: "u2v3", a: "u2", b: "v3", i: 2, j: 3 },
      { id: "u3v1", a: "u3", b: "v1", i: 3, j: 1 },
      { id: "u3v3", a: "u3", b: "v3", i: 3, j: 3 }
    ];

    // One constraint per vertex: sum of incident edge variables <= 1.
    const VERTEX_ORDER = ["u1", "u2", "u3", "v1", "v2", "v3"];

    const selected = new Set();

    const svg = document.getElementById("graph");
    const SVGNS = "http://www.w3.org/2000/svg";

    function el(name, attrs, parent) {
      const node = document.createElementNS(SVGNS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(node);
      return node;
    }

    // Trim an endpoint so the drawn line stops at the circle boundary.
    function trim(from, to, r) {
      const dx = to.x - from.x, dy = to.y - from.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: from.x + dx / len * r, y: from.y + dy / len * r };
    }

    function subLabel(i, j) {
      // produce x with subscript ij using unicode subscripts
      const sub = s => s.replace(/[0-9]/g, d => "₀₁₂₃₄₅₆₇₈₉"[+d]);
      return "x" + sub("" + i + j);
    }

    // Build edges (with a wide invisible hit area) then vertices on top.
    const edgeNodes = {};
    EDGES.forEach(e => {
      const A = V[e.a], B = V[e.b];
      const p1 = trim(A, B, R), p2 = trim(B, A, R);
      const g = el("g", { class: "edge", "data-id": e.id }, svg);
      el("line", { class: "edge-hit", x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }, g);
      el("line", { class: "edge-line", x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }, g);
      // variable label near the midpoint, nudged perpendicular to the edge
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      const t = el("text", { class: "edge-var", x: mx, y: my - 6, "text-anchor": "middle" }, g);
      t.textContent = subLabel(e.i, e.j);
      g.addEventListener("click", () => toggle(e.id));
      edgeNodes[e.id] = g;
    });

    const nodeCircles = {};
    for (const id in V) {
      const p = V[id];
      const fill = p.side === "u" ? "#268bd2" : "#b58900";
      const stroke = p.side === "u" ? "#0d5a8a" : "#7a5c00";
      const c = el("circle", { class: "vnode", cx: p.x, cy: p.y, r: R, fill, stroke, "stroke-width": 2 }, svg);
      const t = el("text", { class: "vlabel", x: p.x, y: p.y + 5, "text-anchor": "middle" }, svg);
      t.textContent = id;
      nodeCircles[id] = c;
    }

    const constraintsBox = document.getElementById("constraints");
    const objectiveEl = document.getElementById("objective");
    const statusEl = document.getElementById("status");

    // Build the decision-variable vector (one 0/1 entry per edge, in EDGES order).
    const xvectorBox = document.getElementById("xvector");
    const bitNodes = {};
    EDGES.forEach(e => {
      const entry = document.createElement("span");
      entry.className = "xvec-entry";
      entry.dataset.id = e.id;
      const bit = document.createElement("span");
      bit.className = "bit";
      bit.textContent = "0";
      const sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = subLabel(e.i, e.j);
      entry.appendChild(bit);
      entry.appendChild(sub);
      xvectorBox.appendChild(entry);
      bitNodes[e.id] = { entry, bit };
    });

    function incidentEdges(vId) {
      return EDGES.filter(e => e.a === vId || e.b === vId);
    }

    function toggle(id) {
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      render();
    }

    function render() {
      // edges + decision-variable vector
      EDGES.forEach(e => {
        const on = selected.has(e.id);
        edgeNodes[e.id].classList.toggle("selected", on);
        bitNodes[e.id].bit.textContent = on ? "1" : "0";
        bitNodes[e.id].entry.classList.toggle("on", on);
      });

      // per-vertex constraints
      const violatedVertices = new Set();
      constraintsBox.innerHTML = "";
      VERTEX_ORDER.forEach(vId => {
        const inc = incidentEdges(vId);
        const chosen = inc.filter(e => selected.has(e.id));
        const sum = chosen.length;
        const violated = sum > 1;
        if (violated) violatedVertices.add(vId);

        const terms = inc.map(e => subLabel(e.i, e.j)).join(" + ");
        const row = document.createElement("div");
        row.className = "con " + (violated ? "violated" : "ok");
        row.innerHTML =
          `<span>${terms} = ${sum} &#8804; 1</span>` +
          `<span class="tag">${vId}${violated ? " ✗" : ""}</span>`;
        constraintsBox.appendChild(row);
      });

      // highlight violated vertices in the graph
      for (const id in nodeCircles) {
        nodeCircles[id].classList.toggle("bad", violatedVertices.has(id));
      }

      // objective = number of selected edges
      objectiveEl.textContent = selected.size;

      // status line
      if (selected.size === 0) {
        statusEl.textContent = "No edges selected.";
        statusEl.className = "status";
      } else if (violatedVertices.size > 0) {
        const list = [...violatedVertices].join(", ");
        statusEl.textContent = `Not a matching: vertices ${list} have more than one selected edge.`;
        statusEl.className = "status bad";
      } else {
        const perfect = selected.size === 3;
        statusEl.textContent = perfect
          ? "Valid matching, and it is perfect (covers all 6 vertices)."
          : `Valid matching of size ${selected.size}.`;
        statusEl.className = "status good";
      }
    }

    document.getElementById("reset").addEventListener("click", () => {
      selected.clear();
      render();
    });

    render();
  </script>
</body>
</html>
