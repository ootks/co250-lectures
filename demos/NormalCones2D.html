<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose an objective direction c on a quadrilateral and see which vertex is optimal, and which region of the c-plane it belongs to">
  <title>Normal Cones of a Quadrilateral</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #fdf6e3;
      color: #586e75;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .panes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 1100px;
    }
    .pane { flex: 1 1 340px; max-width: 520px; }
    .caption { text-align: center; margin: 0 0 4px; font-size: 16px; color: #93a1a1; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fdf6e3;
      border: 1px solid #93a1a1;
      border-radius: 10px;
      touch-action: none;
      cursor: crosshair;
    }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
    button {
      font: inherit;
      font-size: 16px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #93a1a1;
      background: #eee8d5;
      color: #586e75;
      cursor: pointer;
    }
    button:hover { background: #e6dfc8; }
    button[aria-pressed="true"] { background: #268bd2; border-color: #268bd2; color: #fdf6e3; }
    .readout { min-height: 1.5em; font-size: 30px; font-variant-numeric: tabular-nums; text-align: center; }
    .lp { font-size: 28px; line-height: 1.55; text-align: center; font-variant-numeric: tabular-nums; }
    .lp sub { font-size: 0.65em; }
    .lp .row { white-space: nowrap; }
    .lp .kw { color: #93a1a1; font-style: italic; margin-right: 10px; }
    .badge {
      display: inline-block; padding: 0 14px; border-radius: 10px; color: #fdf6e3; font-weight: bold;
      border: 2px solid rgba(0,0,0,0.3);
    }
    .swatch {
      display: inline-block; width: 14px; height: 14px; border-radius: 50%;
      vertical-align: -1px; margin-right: 6px; border: 1.5px solid rgba(0,0,0,0.35);
    }
    body.embed { padding: 4px; gap: 6px; }
    body.embed .caption { display: none; }
    body.embed .panes { gap: 12px; }
    body.embed .pane { flex: 1 1 260px; max-width: 300px; }
    body.embed .readout { font-size: 22px; min-height: 1.3em; }
    body.embed .lp { font-size: 20px; line-height: 1.4; }
    body.embed button { font-size: 14px; padding: 5px 12px; }
  </style>
</head>
<body>
  <div class="panes">
    <div class="pane">
      <p class="caption">Click to choose c (arrow from the center)</p>
      <canvas id="left" aria-label="A quadrilateral with four colored vertices; click to choose an objective direction"></canvas>
    </div>
    <div class="pane">
      <p class="caption">The plane of objective vectors c (click here too)</p>
      <canvas id="right" aria-label="The plane of objective vectors, colored by the optimal vertex"></canvas>
    </div>
  </div>
  <div class="bar">
    <button id="all" type="button" aria-pressed="false">Color the whole c-plane</button>
    <button id="clear" type="button">Clear points</button>
  </div>
  <div class="readout" id="readout">&nbsp;</div>
  <div class="lp" id="lp"></div>

  <script>
    if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');

    // Quadrilateral: x1 >= 0, x2 >= 0, 3x1 + x2 <= 12, -x1 + 3x2 <= 6.
    const V = [[0, 0], [4, 0], [3, 3], [0, 2]];
    const COLORS = ['#cb4b16', '#268bd2', '#859900', '#d33682'];
    const DARK   = ['#8a3210', '#1a5f94', '#556100', '#8f2358'];
    const CENTER = [1.75, 1.25];          // c is measured as (clicked point) - CENTER
    const LEFT_RANGE = [-1.2, 5.2];
    const RIGHT_RANGE = [-3.5, 3.5];

    const readout = document.getElementById('readout');
    const allBtn = document.getElementById('all');
    let c = null, k = -1, pts = [], showAll = false, dragging = false;

    function makeView(id, range) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      const v = { canvas, ctx, range, size: 0, dpr: 1 };
      v.resize = () => {
        v.dpr = window.devicePixelRatio || 1;
        v.size = canvas.clientWidth;
        canvas.width = Math.round(v.size * v.dpr);
        canvas.height = Math.round(v.size * v.dpr);
      };
      v.px = (x, y) => {
        const s = v.size / (range[1] - range[0]);
        return [(x - range[0]) * s, (range[1] - y) * s];
      };
      v.world = (px, py) => {
        const s = (range[1] - range[0]) / v.size;
        return [range[0] + px * s, range[1] - py * s];
      };
      return v;
    }
    const L = makeView('left', LEFT_RANGE);
    const R = makeView('right', RIGHT_RANGE);

    function best(cv) {
      let b = 0, bv = -Infinity;
      for (let i = 0; i < V.length; i++) {
        const d = cv[0] * V[i][0] + cv[1] * V[i][1];
        if (d > bv + 1e-9) { bv = d; b = i; }
      }
      return b;
    }

    function begin(v) {
      v.ctx.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
      v.ctx.clearRect(0, 0, v.size, v.size);
    }

    function axes(v, ox, oy) {
      const ctx = v.ctx, r = v.range;
      ctx.strokeStyle = '#93a1a1'; ctx.lineWidth = 1.5;
      let a = v.px(r[0], oy), b = v.px(r[1], oy);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      a = v.px(ox, r[0]); b = v.px(ox, r[1]);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }

    function arrow(v, from, to, color, width) {
      const ctx = v.ctx;
      const a = v.px(from[0], from[1]), b = v.px(to[0], to[1]);
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const head = 14;
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0] - Math.cos(ang) * head * 0.6, b[1] - Math.sin(ang) * head * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b[0], b[1]);
      ctx.lineTo(b[0] - head * Math.cos(ang - 0.4), b[1] - head * Math.sin(ang - 0.4));
      ctx.lineTo(b[0] - head * Math.cos(ang + 0.4), b[1] - head * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
    }

    function dot(v, p, r, fill, stroke, lw) {
      const q = v.px(p[0], p[1]), ctx = v.ctx;
      ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
    }

    function drawLeft() {
      const ctx = L.ctx;
      begin(L);
      axes(L, 0, 0);
      ctx.beginPath();
      V.forEach((p, i) => { const q = L.px(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
      ctx.closePath();
      ctx.fillStyle = 'rgba(38,139,210,0.16)'; ctx.fill();
      ctx.strokeStyle = '#268bd2'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();

      if (c) {
        // level line through the optimal vertex, perpendicular to c
        const n = Math.hypot(c[0], c[1]), d = [-c[1] / n, c[0] / n], p = V[k];
        const a = L.px(p[0] - 3 * d[0], p[1] - 3 * d[1]), b = L.px(p[0] + 3 * d[0], p[1] + 3 * d[1]);
        ctx.setLineDash([8, 6]); ctx.strokeStyle = '#6c71c4'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        ctx.setLineDash([]);
        dot(L, CENTER, 4, '#000000');
        const m = Math.min(1, 2.2 / n);
        arrow(L, CENTER, [CENTER[0] + c[0] * m, CENTER[1] + c[1] * m], '#000000', 4);
      }
      V.forEach((p, i) => {
        if (i === k) {
          dot(L, p, 18, 'rgba(0,0,0,0)', COLORS[i], 4);
          dot(L, p, 11, COLORS[i], DARK[i], 2.5);
        } else {
          dot(L, p, 8, COLORS[i], DARK[i], 2);
        }
      });
    }

    function drawRight() {
      const ctx = R.ctx;
      begin(R);
      if (showAll) {
        const W = Math.round(R.size * R.dpr);
        const img = ctx.createImageData(W, W);
        const rgb = COLORS.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
        const s = (RIGHT_RANGE[1] - RIGHT_RANGE[0]) / W;
        for (let py = 0; py < W; py++) {
          const y = RIGHT_RANGE[1] - (py + 0.5) * s;
          for (let px = 0; px < W; px++) {
            const x = RIGHT_RANGE[0] + (px + 0.5) * s;
            const j = best([x, y]), col = rgb[j], o = (py * W + px) * 4;
            img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 110;
          }
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.putImageData(img, 0, 0);
        ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
      }
      axes(R, 0, 0);
      pts.forEach(q => dot(R, q.c, 5, COLORS[q.k], DARK[q.k], 1.5));
      dot(R, [0, 0], 3.5, '#586e75');
    }

    function draw() { drawLeft(); drawRight(); }

    const SUB = ['<sub>1</sub>', '<sub>2</sub>'];
    function updateReadout() {
      const lp = document.getElementById('lp');
      let obj;
      if (c) {
        const t1 = c[0].toFixed(2) + 'x' + SUB[0];
        const t2 = (c[1] < 0 ? ' \u2212 ' : ' + ') + Math.abs(c[1]).toFixed(2) + 'x' + SUB[1];
        obj = t1.replace('-', '\u2212') + t2;
        readout.innerHTML = '<span class="swatch" style="background:' + COLORS[k] + '"></span>' +
          'c = (' + c[0].toFixed(2) + ', ' + c[1].toFixed(2) + ')';
      } else {
        obj = 'c' + SUB[0] + 'x' + SUB[0] + ' + c' + SUB[1] + 'x' + SUB[1];
        readout.innerHTML = '&nbsp;';
      }
      const vert = c ? '<div class="row"><span class="kw">optimal vertex</span><span class="badge" style="background:' +
        COLORS[k] + '">(' + V[k][0] + ', ' + V[k][1] + ')</span></div>' : '';
      lp.innerHTML =
        '<div class="row"><span class="kw">max</span>' + obj + '</div>' +
        '<div class="row"><span class="kw">s.t.</span>x' + SUB[0] + ' \u2265 0,&ensp;x' + SUB[1] + ' \u2265 0,&ensp;' +
        '3x' + SUB[0] + ' + x' + SUB[1] + ' \u2264 12,&ensp;\u2212x' + SUB[0] + ' + 3x' + SUB[1] + ' \u2264 6</div>' + vert;
    }

    // Clicking in the c-plane chooses c directly; clicking in the left pane chooses c = point - center.
    function cFromEvent(e, view, isLeft) {
      const r = view.canvas.getBoundingClientRect();
      const p = view.world((e.clientX - r.left) * (view.size / r.width), (e.clientY - r.top) * (view.size / r.height));
      return isLeft ? [p[0] - CENTER[0], p[1] - CENTER[1]] : p;
    }
    function pick(e, view, isLeft, add) {
      const nc = cFromEvent(e, view, isLeft);
      if (Math.hypot(nc[0], nc[1]) < 1e-6) return;
      c = nc; k = best(c);
      if (add) { pts.push({ c: nc, k }); if (pts.length > 600) pts.shift(); }
      updateReadout(); draw();
    }
    [[L, true], [R, false]].forEach(([view, isLeft]) => {
      view.canvas.addEventListener('pointerdown', e => {
        dragging = view; view.canvas.setPointerCapture(e.pointerId); pick(e, view, isLeft, true);
      });
      view.canvas.addEventListener('pointermove', e => {
        if (dragging !== view) return;
        const last = pts[pts.length - 1], nc = cFromEvent(e, view, isLeft);
        pick(e, view, isLeft, !last || Math.hypot(nc[0] - last.c[0], nc[1] - last.c[1]) > 0.15);
      });
      const stop = () => { if (dragging === view) dragging = false; };
      view.canvas.addEventListener('pointerup', stop);
      view.canvas.addEventListener('pointercancel', stop);
    });

    allBtn.addEventListener('click', () => {
      showAll = !showAll; allBtn.setAttribute('aria-pressed', String(showAll)); draw();
    });
    document.getElementById('clear').addEventListener('click', () => {
      pts = []; c = null; k = -1; updateReadout(); draw();
    });

    function resizeAll() { L.resize(); R.resize(); draw(); }
    new ResizeObserver(resizeAll).observe(L.canvas);
    window.addEventListener('resize', resizeAll);
    updateReadout();
    resizeAll();
  </script>
</body>
</html>
