<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Two-dimensional linear subspace of R3</title>
  <desc id="desc">Three-dimensional coordinate axes with a translucent purple plane passing through the origin, representing the span of two independent vectors.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <marker id="basis-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <text x="70" y="78" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">Dimension 2</text>
  <text x="70" y="118" font-family="Inter, Arial, sans-serif" font-size="24" fill="#526178">A plane through the origin</text>

  <!-- Coordinate axes behind the plane -->
  <path d="M600 430 L1030 610" fill="none" stroke="#CBD5E1" stroke-width="4" marker-end="url(#axis-arrow)"/>
  <path d="M600 430 L170 610" fill="none" stroke="#CBD5E1" stroke-width="4" marker-end="url(#axis-arrow)"/>
  <path d="M600 430 L600 80" fill="none" stroke="#CBD5E1" stroke-width="4" marker-end="url(#axis-arrow)"/>

  <!-- Two-dimensional subspace -->
  <polygon points="150,440 650,260 1050,420 550,600" fill="#8B5CF6" fill-opacity="0.18" stroke="#7C3AED" stroke-width="5" stroke-linejoin="round"/>
  <path d="M600 430 L850 340" fill="none" stroke="#7C3AED" stroke-width="9" stroke-linecap="round" marker-end="url(#basis-arrow)"/>
  <path d="M600 430 L420 350" fill="none" stroke="#7C3AED" stroke-width="9" stroke-linecap="round" marker-end="url(#basis-arrow)"/>
  <circle cx="600" cy="430" r="11" fill="#172033"/>
  <text x="618" y="458" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#172033">0</text>
  <text x="829" y="332" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#6D28D9">u</text>
  <text x="392" y="340" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#6D28D9">v</text>

  <!-- Axis labels remain visible above the plane -->
  <text x="1045" y="629" font-family="Inter, Arial, sans-serif" font-size="25" font-style="italic" fill="#526178">x₁</text>
  <text x="132" y="634" font-family="Inter, Arial, sans-serif" font-size="25" font-style="italic" fill="#526178">x₂</text>
  <text x="616" y="83" font-family="Inter, Arial, sans-serif" font-size="25" font-style="italic" fill="#526178">x₃</text>

  <rect x="340" y="658" width="520" height="58" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="600" y="696" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#6D28D9">W = span{u, v}</text>
</svg>
