<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Zero-dimensional linear subspace of R3</title>
  <desc id="desc">Three-dimensional coordinate axes with a blue line passing through the origin, representing the span of one nonzero vector.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <marker id="line-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="34" markerHeight="34" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="70" y="78" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">Dimension 0</text>
  <text x="70" y="118" font-family="Inter, Arial, sans-serif" font-size="24" fill="#526178">A point</text>

  <!-- Coordinate axes -->
  <path d="M600 430 L1030 610" fill="none" stroke="#94A3B8" stroke-width="4" marker-end="url(#axis-arrow)"/>
  <path d="M600 430 L170 610" fill="none" stroke="#94A3B8" stroke-width="4" marker-end="url(#axis-arrow)"/>
  <path d="M600 430 L600 80" fill="none" stroke="#94A3B8" stroke-width="4" marker-end="url(#axis-arrow)"/>
  <text x="1045" y="629" font-family="Inter, Arial, sans-serif" font-size="25" font-style="italic" fill="#526178">x₁</text>
  <text x="132" y="634" font-family="Inter, Arial, sans-serif" font-size="25" font-style="italic" fill="#526178">x₂</text>
  <text x="616" y="83" font-family="Inter, Arial, sans-serif" font-size="25" font-style="italic" fill="#526178">x₃</text>

  <circle cx="600" cy="430" r="11" fill="#172033"/>
  <text x="618" y="458" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#172033">0</text>

  <rect x="370" y="658" width="460" height="58" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="600" y="696" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#1D4ED8">W = 0</text>
</svg>
