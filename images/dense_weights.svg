<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="Georgia, serif">
  <!-- A dense weight vector: ordinary least squares tends to make every weight nonzero. -->
  <!-- Bar chart of theta_1 .. theta_8, all bars nonzero (positive or negative). -->
  <!-- baseline (theta = 0) at y=150; bars grow up (positive) or down (negative). -->

  <!-- zero axis -->
  <line x1="50" y1="150" x2="390" y2="150" stroke="#586e75" stroke-width="1.8"/>
  <text x="44" y="155" text-anchor="end" font-size="13" fill="#586e75">0</text>
  <text x="30" y="90" text-anchor="middle" font-size="14" font-style="italic" fill="#586e75" transform="rotate(-90 30 90)">weight</text>

  <!-- bars: x positions 70,110,...,  width 26 -->
  <g fill="#268bd2" stroke="#0d5a8a" stroke-width="1.5">
    <rect x="62"  y="80"  width="26" height="70"/>            <!-- +70 -->
    <rect x="102" y="150" width="26" height="42"/>            <!-- -42 -->
    <rect x="142" y="110" width="26" height="40"/>            <!-- +40 -->
    <rect x="182" y="150" width="26" height="66"/>            <!-- -66 -->
    <rect x="222" y="96"  width="26" height="54"/>            <!-- +54 -->
    <rect x="262" y="150" width="26" height="24"/>            <!-- -24 -->
    <rect x="302" y="120" width="26" height="30"/>            <!-- +30 -->
    <rect x="342" y="150" width="26" height="52"/>            <!-- -52 -->
  </g>

  <!-- component labels -->
  <g font-size="12" fill="#586e75" text-anchor="middle">
    <text x="75"  y="234">&#952;&#8321;</text>
    <text x="115" y="234">&#952;&#8322;</text>
    <text x="155" y="234">&#952;&#8323;</text>
    <text x="195" y="234">&#952;&#8324;</text>
    <text x="235" y="234">&#952;&#8325;</text>
    <text x="275" y="234">&#952;&#8326;</text>
    <text x="315" y="234">&#952;&#8327;</text>
    <text x="355" y="234">&#952;&#8328;</text>
  </g>

  <text x="210" y="270" text-anchor="middle" font-size="13" fill="#657b83">Ordinary least squares typically makes <tspan font-style="italic">every</tspan> weight nonzero (a dense solution).</text>
</svg>
