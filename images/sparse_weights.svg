<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="Georgia, serif">
  <!-- A sparse weight vector: LASSO drives most weights exactly to zero. -->
  <!-- Bar chart of theta_1 .. theta_8; only theta_1, theta_4, theta_6 are nonzero. -->
  <!-- baseline (theta = 0) at y=150; bars grow up (positive) or down (negative). -->

  <!-- zero axis -->
  <line x1="50" y1="150" x2="390" y2="150" stroke="#586e75" stroke-width="1.8"/>
  <text x="44" y="155" text-anchor="end" font-size="13" fill="#586e75">0</text>
  <text x="30" y="90" text-anchor="middle" font-size="14" font-style="italic" fill="#586e75" transform="rotate(-90 30 90)">weight</text>

  <!-- nonzero weights (green): theta_1 = +70, theta_4 = -66, theta_6 = -24 -->
  <g fill="#859900" stroke="#556100" stroke-width="1.5">
    <rect x="62"  y="80"  width="26" height="70"/>            <!-- theta_1 = +70 -->
    <rect x="182" y="150" width="26" height="66"/>            <!-- theta_4 = -66 -->
    <rect x="262" y="150" width="26" height="24"/>            <!-- theta_6 = -24 -->
  </g>

  <!-- zero weights: short flat markers sitting on the baseline -->
  <g fill="#93a1a1" stroke="#93a1a1" stroke-width="1.5">
    <rect x="102" y="148" width="26" height="4"/>            <!-- theta_2 = 0 -->
    <rect x="142" y="148" width="26" height="4"/>            <!-- theta_3 = 0 -->
    <rect x="222" y="148" width="26" height="4"/>            <!-- theta_5 = 0 -->
    <rect x="302" y="148" width="26" height="4"/>            <!-- theta_7 = 0 -->
    <rect x="342" y="148" width="26" height="4"/>            <!-- theta_8 = 0 -->
  </g>

  <!-- component labels -->
  <g font-size="12" fill="#586e75" text-anchor="middle">
    <text x="75"  y="234">&#952;&#8321;</text>
    <text x="115" y="234">&#952;&#8322;</text>
    <text x="155" y="234">&#952;&#8323;</text>
    <text x="195" y="234">&#952;&#8324;</text>
    <text x="235" y="234">&#952;&#8325;</text>
    <text x="275" y="234">&#952;&#8326;</text>
    <text x="315" y="234">&#952;&#8327;</text>
    <text x="355" y="234">&#952;&#8328;</text>
  </g>

  <text x="210" y="270" text-anchor="middle" font-size="13" fill="#657b83">LASSO drives most weights to <tspan font-style="italic">exactly</tspan> zero (a sparse solution).</text>
</svg>
