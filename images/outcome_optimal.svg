<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170" font-family="Georgia, serif">
  <!-- Optimal: bounded feasible polygon with optimal vertex marked. -->
  <defs>
    <marker id="arrOpt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#556100"/>
    </marker>
  </defs>
  <line x1="20" y1="150" x2="185" y2="150" stroke="#93a1a1" stroke-width="1.4"/>
  <line x1="20" y1="150" x2="20"  y2="20"  stroke="#93a1a1" stroke-width="1.4"/>
  <polygon points="20,150 115,150 150,90 75,50 20,78"
           fill="#859900" fill-opacity="0.18" stroke="#859900" stroke-width="2" stroke-linejoin="round"/>
  <!-- objective improving direction (-c): starts at x* and points out of the region -->
  <line x1="150" y1="90" x2="182" y2="66" stroke="#556100" stroke-width="2" marker-end="url(#arrOpt)"/>
  <text x="170" y="58" font-size="12" fill="#556100" font-style="italic">&#8722;c</text>
  <circle cx="150" cy="90" r="5" fill="#859900" stroke="#fff" stroke-width="1.5"/>
  <text x="138" y="104" font-size="13" fill="#556100" font-style="italic" text-anchor="end">x*</text>
</svg>
