<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" font-family="Georgia, serif">
  <!-- SEF feasible set of a 2-variable equality: the segment of a line between the two axes.
       No text. -->
  <defs>
    <marker id="ax2d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a1a1"/>
    </marker>
  </defs>

  <!-- nonnegative orthant (light tint) -->
  <rect x="50" y="60" width="210" height="190" fill="#268bd2" fill-opacity="0.08"/>

  <!-- axes -->
  <line x1="50" y1="250" x2="285" y2="250" stroke="#93a1a1" stroke-width="1.8" marker-end="url(#ax2d)"/>
  <line x1="50" y1="250" x2="50"  y2="45"  stroke="#93a1a1" stroke-width="1.8" marker-end="url(#ax2d)"/>

  <!-- the SEF feasible set: segment of the line a1 x1 + a2 x2 = b between the axes -->
  <line x1="50" y1="100" x2="240" y2="250" stroke="#268bd2" stroke-width="4" stroke-linecap="round"/>

  <!-- endpoints on the axes -->
  <circle cx="50"  cy="100" r="5.5" fill="#268bd2" stroke="#0d5a8a" stroke-width="1.5"/>
  <circle cx="240" cy="250" r="5.5" fill="#268bd2" stroke="#0d5a8a" stroke-width="1.5"/>
</svg>
