<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" font-family="Georgia, serif">
  <!-- A 3D LP in SEF: x1 + x2 + x3 = 1, x >= 0. -->
  <!-- Feasible region is the 2-simplex (triangle) with vertices e1, e2, e3. -->
  <!-- Each vertex is a basic feasible solution; its basis is the single nonzero coordinate. -->

  <!-- projection: origin O=(160,200); e1=(70,245); e2=(270,240); e3=(160,50) -->

  <!-- coordinate axes (extend a bit past the unit points) -->
  <g stroke="#93a1a1" stroke-width="1.6">
    <line x1="160" y1="200" x2="40"  y2="260"/>   <!-- x1 axis -->
    <line x1="160" y1="200" x2="300" y2="253"/>   <!-- x2 axis -->
    <line x1="160" y1="200" x2="160" y2="30"/>    <!-- x3 axis -->
  </g>
  <g fill="#93a1a1" font-size="13" font-style="italic">
    <text x="34"  y="272">x&#8321;</text>
    <text x="305" y="257">x&#8322;</text>
    <text x="150" y="26">x&#8323;</text>
  </g>

  <!-- origin -->
  <circle cx="160" cy="200" r="2.5" fill="#93a1a1"/>

  <!-- the feasible triangle x1+x2+x3 = 1, x>=0 -->
  <polygon points="70,245 270,240 160,50"
           fill="#268bd2" fill-opacity="0.16" stroke="#268bd2" stroke-width="2" stroke-linejoin="round"/>
  <text x="180" y="165" font-size="13" fill="#0d5a8a" font-style="italic">x&#8321;+x&#8322;+x&#8323; = 1</text>

  <!-- vertices (basic feasible solutions), highlighted -->
  <g fill="#cb4b16" stroke="#8a3210" stroke-width="2">
    <circle cx="70"  cy="245" r="6"/>
    <circle cx="270" cy="240" r="6"/>
    <circle cx="160" cy="50"  r="6"/>
  </g>

  <!-- vertex labels: coordinates and corresponding basis -->
  <g font-size="13" fill="#586e75">
    <text x="30"  y="240" text-anchor="middle">(1,0,0)</text>
    <text x="30"  y="256" text-anchor="middle" fill="#8a3210">basis {1}</text>

    <text x="300" y="235" text-anchor="middle">(0,1,0)</text>
    <text x="300" y="251" text-anchor="middle" fill="#8a3210">basis {2}</text>

    <text x="160" y="34"  text-anchor="middle">(0,0,1)</text>
    <text x="222" y="52"  text-anchor="middle" fill="#8a3210">basis {3}</text>
  </g>

  <text x="210" y="308" text-anchor="middle" font-size="12.5" fill="#657b83">Each vertex is a basic feasible solution; its basis is the nonzero coordinate.</text>
</svg>
