<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">Profit is at most the offer for resources used, which is at most the offer for all resources</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Georgia, serif" stroke-linecap="round" stroke-linejoin="round"><text x="180" y="25" font-size="21" fill="#586e75" text-anchor="middle">Compare the payments</text><text x="30" y="67" font-size="17" fill="#859900" text-anchor="start">Furniture profit</text><rect x="30" y="83" width="155" height="28" rx="4" fill="#859900" fill-opacity=".65"/><text x="30" y="155" font-size="17" fill="#268bd2" text-anchor="start">Offer for resources used</text><rect x="30" y="171" width="225" height="28" rx="4" fill="#268bd2" fill-opacity=".65"/><text x="30" y="243" font-size="17" fill="#164b78" text-anchor="start">Offer for all resources</text><rect x="30" y="259" width="290" height="28" rx="4" fill="#164b78" fill-opacity=".65"/><text x="180" y="145" font-size="24" fill="#586e75" text-anchor="middle">≤</text><text x="180" y="233" font-size="24" fill="#586e75" text-anchor="middle">≤</text><text x="180" y="330" font-size="15" fill="#586e75" text-anchor="middle">Schematic: the amounts may be equal</text></g></svg>