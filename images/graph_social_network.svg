<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" font-family="Georgia, serif">
  <!-- Friendship network: people are vertices, edges are friendships -->
  <g stroke="#586e75" stroke-width="2.5">
    <line x1="120" y1="80"  x2="230" y2="60"/>
    <line x1="120" y1="80"  x2="70"  y2="190"/>
    <line x1="230" y1="60"  x2="330" y2="130"/>
    <line x1="230" y1="60"  x2="200" y2="180"/>
    <line x1="70"  y1="190" x2="200" y2="180"/>
    <line x1="70"  y1="190" x2="150" y2="290"/>
    <line x1="200" y1="180" x2="150" y2="290"/>
    <line x1="200" y1="180" x2="330" y2="130"/>
    <line x1="330" y1="130" x2="320" y2="270"/>
    <line x1="200" y1="180" x2="320" y2="270"/>
    <line x1="150" y1="290" x2="320" y2="270"/>
  </g>
  <g fill="#859900" stroke="#556100" stroke-width="2">
    <circle cx="120" cy="80"  r="26"/>
    <circle cx="230" cy="60"  r="26"/>
    <circle cx="330" cy="130" r="26"/>
    <circle cx="70"  cy="190" r="26"/>
    <circle cx="200" cy="180" r="26"/>
    <circle cx="150" cy="290" r="26"/>
    <circle cx="320" cy="270" r="26"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="120" y="85">Ava</text>
    <text x="230" y="65">Ben</text>
    <text x="330" y="135">Cy</text>
    <text x="70"  y="195">Dan</text>
    <text x="200" y="185">Eve</text>
    <text x="150" y="295">Fay</text>
    <text x="320" y="275">Gus</text>
  </g>
</svg>
