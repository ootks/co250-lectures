<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Georgia, serif">
  <!-- Exploded 0-dim faces (vertices) of a cube. Projection: +x right, +y depth (up-right), +z up.
       Central cube: translucent purple (3D). Vertices: green (all 8). -->

  <!-- connectors from each vertex to the cube corner it came from -->
  <g stroke="#93a1a1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="165.1" y1="255.9" x2="76.3"  y2="336.7"/>
    <line x1="165.1" y1="193.9" x2="56.4"  y2="143.0"/>
    <line x1="192.9" y1="236.1" x2="117.5" y2="329.4"/>
    <line x1="192.9" y1="174.1" x2="146.8" y2="63.3"/>
    <line x1="227.1" y1="255.9" x2="273.2" y2="366.7"/>
    <line x1="227.1" y1="193.9" x2="302.5" y2="100.6"/>
    <line x1="254.9" y1="236.1" x2="363.6" y2="287.0"/>
    <line x1="254.9" y1="174.1" x2="343.7" y2="93.3"/>
  </g>

  <!-- central cube: translucent purple, shown in 3D (three visible faces + hidden edges) -->
  <g stroke="#4a4a99" stroke-width="1.5" stroke-linejoin="round">
    <!-- hidden back edges -->
    <g stroke="#9a9ad0" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
      <line x1="192.9" y1="236.1" x2="165.1" y2="255.9"/>
      <line x1="192.9" y1="236.1" x2="254.9" y2="236.1"/>
      <line x1="192.9" y1="236.1" x2="192.9" y2="174.1"/>
    </g>
    <polygon points="165.1,255.9 227.1,255.9 227.1,193.9 165.1,193.9" fill="#6c71c4" fill-opacity="0.4"/>
    <polygon points="227.1,255.9 254.9,236.1 254.9,174.1 227.1,193.9" fill="#6c71c4" fill-opacity="0.3"/>
    <polygon points="165.1,193.9 227.1,193.9 254.9,174.1 192.9,174.1" fill="#6c71c4" fill-opacity="0.5"/>
  </g>

  <!-- exploded vertices: green (all 8) -->
  <g fill="#859900" stroke="#556100" stroke-width="1.6">
    <circle cx="76.3"  cy="336.7" r="7"/>
    <circle cx="56.4"  cy="143.0" r="7"/>
    <circle cx="117.5" cy="329.4" r="7"/>
    <circle cx="146.8" cy="63.3"  r="7"/>
    <circle cx="273.2" cy="366.7" r="7"/>
    <circle cx="302.5" cy="100.6" r="7"/>
    <circle cx="363.6" cy="287.0" r="7"/>
    <circle cx="343.7" cy="93.3"  r="7"/>
  </g>
</svg>
