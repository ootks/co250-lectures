<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" font-family="Georgia, serif">
  <!-- A 3-dimensional polytope: a cube drawn in projection. -->
  <!-- back face -->
  <polygon points="80,55 170,55 170,135 80,135" fill="#268bd2" fill-opacity="0.10"
           stroke="#e08a86" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- front face -->
  <polygon points="50,80 140,80 140,160 50,160" fill="#268bd2" fill-opacity="0.22"
           stroke="#dc322f" stroke-width="3" stroke-linejoin="round"/>
  <!-- connecting edges -->
  <g stroke="#dc322f" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="80"  x2="80"  y2="55"/>
    <line x1="140" y1="80" x2="170" y2="55"/>
    <line x1="140" y1="160" x2="170" y2="135"/>
  </g>
  <line x1="50" y1="160" x2="80" y2="135" stroke="#e08a86" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- vertices -->
  <g fill="#859900" stroke="#556100" stroke-width="1.5">
    <circle cx="50"  cy="80"  r="5.5"/>
    <circle cx="140" cy="80"  r="5.5"/>
    <circle cx="140" cy="160" r="5.5"/>
    <circle cx="50"  cy="160" r="5.5"/>
    <circle cx="80"  cy="55"  r="5.5"/>
    <circle cx="170" cy="55"  r="5.5"/>
    <circle cx="170" cy="135" r="5.5"/>
    <circle cx="80"  cy="135" r="5.5"/>
  </g>
</svg>
