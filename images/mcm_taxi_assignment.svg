<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400" font-family="Georgia, serif">
  <!-- Cartoon city map with 3 taxis and 3 people scattered around, plus
       lines between every person and taxi labelled with distances. -->

  <!-- map background -->
  <rect x="10" y="10" width="560" height="380" rx="16" fill="#eef7e9" stroke="#93a1a1" stroke-width="2"/>

  <!-- river -->
  <path d="M 10 250 C 140 220, 180 320, 320 300 S 520 240, 570 270 L 570 300 C 520 270, 420 330, 320 330 S 150 250, 10 285 Z"
        fill="#9fd0e6" stroke="#5a9fbf" stroke-width="1.5"/>

  <!-- park -->
  <rect x="60" y="60" width="120" height="90" rx="10" fill="#c8e6a0" stroke="#8bbf5a" stroke-width="1.5"/>
  <circle cx="95"  cy="95"  r="12" fill="#7bbf4a"/>
  <circle cx="135" cy="110" r="14" fill="#7bbf4a"/>
  <circle cx="155" cy="85"  r="10" fill="#7bbf4a"/>

  <!-- roads (grid) -->
  <g stroke="#fdf6e3" stroke-width="12" stroke-linecap="round">
    <line x1="30" y1="190" x2="550" y2="190"/>
    <line x1="230" y1="30" x2="230" y2="370"/>
    <line x1="420" y1="30" x2="420" y2="370"/>
  </g>
  <g stroke="#e0d8b8" stroke-width="2" stroke-dasharray="10 10">
    <line x1="30" y1="190" x2="550" y2="190"/>
    <line x1="230" y1="30" x2="230" y2="370"/>
    <line x1="420" y1="30" x2="420" y2="370"/>
  </g>

  <!-- a couple of simple buildings -->
  <g fill="#f4d8a8" stroke="#b89a66" stroke-width="1.5">
    <rect x="300" y="60" width="70" height="70" rx="4"/>
    <rect x="470" y="90" width="60" height="80" rx="4"/>
    <rect x="300" y="300" width="80" height="60" rx="4"/>
  </g>
  <g fill="#b89a66">
    <rect x="312" y="74" width="12" height="12"/><rect x="334" y="74" width="12" height="12"/>
    <rect x="312" y="100" width="12" height="12"/><rect x="334" y="100" width="12" height="12"/>
    <rect x="482" y="104" width="12" height="14"/><rect x="504" y="104" width="12" height="14"/>
    <rect x="482" y="134" width="12" height="14"/><rect x="504" y="134" width="12" height="14"/>
  </g>

  <!-- ================= connection lines (person <-> taxi) =================
       taxis  : T1 (120,250)  T2 (470,230)  T3 (350,170)
       people : P1 (120,110)  P2 (510,310)  P3 (250,340) -->
  <g stroke="#657b83" stroke-width="2" stroke-dasharray="7 5">
    <!-- P1 to each taxi -->
    <line x1="120" y1="110" x2="120" y2="250"/>
    <line x1="120" y1="110" x2="470" y2="230"/>
    <line x1="120" y1="110" x2="350" y2="170"/>
    <!-- P2 to each taxi -->
    <line x1="510" y1="310" x2="120" y2="250"/>
    <line x1="510" y1="310" x2="470" y2="230"/>
    <line x1="510" y1="310" x2="350" y2="170"/>
    <!-- P3 to each taxi -->
    <line x1="250" y1="340" x2="120" y2="250"/>
    <line x1="250" y1="340" x2="470" y2="230"/>
    <line x1="250" y1="340" x2="350" y2="170"/>
  </g>

  <!-- distance labels at line midpoints -->
  <g font-size="14" fill="#073642">
    <!-- P1-T1 mid (120,180) -->
    <rect x="104" y="168" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="120" y="184" text-anchor="middle">2</text>
    <!-- P1-T2 mid (295,170) -->
    <rect x="279" y="159" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="295" y="175" text-anchor="middle">4</text>
    <!-- P1-T3 mid (235,140) -->
    <rect x="219" y="129" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="235" y="145" text-anchor="middle">3</text>
    <!-- P2-T1 mid (315,280) -->
    <rect x="299" y="269" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="315" y="285" text-anchor="middle">5</text>
    <!-- P2-T2 mid (490,270) -->
    <rect x="474" y="259" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="490" y="275" text-anchor="middle">1</text>
    <!-- P2-T3 mid (430,240) -->
    <rect x="414" y="229" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="430" y="245" text-anchor="middle">3</text>
    <!-- P3-T1 mid (185,295) -->
    <rect x="169" y="284" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="185" y="300" text-anchor="middle">2</text>
    <!-- P3-T2 mid (360,285) -->
    <rect x="344" y="296" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="360" y="312" text-anchor="middle">4</text>
    <!-- P3-T3 mid (300,255) -->
    <rect x="284" y="244" width="32" height="22" rx="6" fill="#eef7e9" stroke="#657b83" stroke-width="1"/>
    <text x="300" y="260" text-anchor="middle">2</text>
  </g>

  <!-- ================= taxis ================= -->
  <g id="taxis">
    <!-- reusable taxi drawn at each location -->
    <g transform="translate(120,250)">
      <ellipse cx="0" cy="16" rx="30" ry="5" fill="#000" opacity="0.12"/>
      <rect x="-28" y="-6" width="56" height="20" rx="7" fill="#f6c700" stroke="#073642" stroke-width="2"/>
      <path d="M -16 -6 L -9 -18 L 11 -18 L 18 -6 Z" fill="#ffe14d" stroke="#073642" stroke-width="2"/>
      <rect x="-9" y="-28" width="18" height="9" rx="2" fill="#073642"/>
      <text x="0" y="-21" text-anchor="middle" font-size="7" fill="#f6c700">TAXI</text>
      <rect x="-20" y="1" width="40" height="5" fill="#2a2a2a"/>
      <circle cx="-16" cy="15" r="6" fill="#2a2a2a" stroke="#999" stroke-width="2"/>
      <circle cx="16"  cy="15" r="6" fill="#2a2a2a" stroke="#999" stroke-width="2"/>
    </g>
    <g transform="translate(470,230)">
      <ellipse cx="0" cy="16" rx="30" ry="5" fill="#000" opacity="0.12"/>
      <rect x="-28" y="-6" width="56" height="20" rx="7" fill="#f6c700" stroke="#073642" stroke-width="2"/>
      <path d="M -16 -6 L -9 -18 L 11 -18 L 18 -6 Z" fill="#ffe14d" stroke="#073642" stroke-width="2"/>
      <rect x="-9" y="-28" width="18" height="9" rx="2" fill="#073642"/>
      <text x="0" y="-21" text-anchor="middle" font-size="7" fill="#f6c700">TAXI</text>
      <rect x="-20" y="1" width="40" height="5" fill="#2a2a2a"/>
      <circle cx="-16" cy="15" r="6" fill="#2a2a2a" stroke="#999" stroke-width="2"/>
      <circle cx="16"  cy="15" r="6" fill="#2a2a2a" stroke="#999" stroke-width="2"/>
    </g>
    <g transform="translate(350,170)">
      <ellipse cx="0" cy="16" rx="30" ry="5" fill="#000" opacity="0.12"/>
      <rect x="-28" y="-6" width="56" height="20" rx="7" fill="#f6c700" stroke="#073642" stroke-width="2"/>
      <path d="M -16 -6 L -9 -18 L 11 -18 L 18 -6 Z" fill="#ffe14d" stroke="#073642" stroke-width="2"/>
      <rect x="-9" y="-28" width="18" height="9" rx="2" fill="#073642"/>
      <text x="0" y="-21" text-anchor="middle" font-size="7" fill="#f6c700">TAXI</text>
      <rect x="-20" y="1" width="40" height="5" fill="#2a2a2a"/>
      <circle cx="-16" cy="15" r="6" fill="#2a2a2a" stroke="#999" stroke-width="2"/>
      <circle cx="16"  cy="15" r="6" fill="#2a2a2a" stroke="#999" stroke-width="2"/>
    </g>
  </g>

  <!-- ================= people ================= -->
  <g id="people">
    <g transform="translate(120,110)">
      <ellipse cx="0" cy="24" rx="12" ry="4" fill="#000" opacity="0.12"/>
      <circle cx="0" cy="-12" r="9" fill="#ffd9b3" stroke="#073642" stroke-width="2"/>
      <path d="M -13 22 L -10 2 Q 0 -6 10 2 L 13 22 Z" fill="#268bd2" stroke="#073642" stroke-width="2"/>
    </g>
    <g transform="translate(510,310)">
      <ellipse cx="0" cy="24" rx="12" ry="4" fill="#000" opacity="0.12"/>
      <circle cx="0" cy="-12" r="9" fill="#ffd9b3" stroke="#073642" stroke-width="2"/>
      <path d="M -13 22 L -10 2 Q 0 -6 10 2 L 13 22 Z" fill="#d33682" stroke="#073642" stroke-width="2"/>
    </g>
    <g transform="translate(250,340)">
      <ellipse cx="0" cy="24" rx="12" ry="4" fill="#000" opacity="0.12"/>
      <circle cx="0" cy="-12" r="9" fill="#ffd9b3" stroke="#073642" stroke-width="2"/>
      <path d="M -13 22 L -10 2 Q 0 -6 10 2 L 13 22 Z" fill="#6c71c4" stroke="#073642" stroke-width="2"/>
    </g>
  </g>
</svg>
