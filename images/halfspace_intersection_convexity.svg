<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="Georgia, serif" role="img" aria-labelledby="title desc">
  <title id="title">The intersection of two halfspaces is convex</title>
  <desc id="desc">Three scenes repeat every twelve seconds. The same endpoints x and y and their line segment lie in the first halfspace, in the second halfspace, and hence in their intersection. A moving point traces the segment.</desc>
  <defs>
    <clipPath id="plot"><rect x="50" y="65" width="620" height="290" rx="6"/></clipPath>
  </defs>
  <rect x="50" y="65" width="620" height="290" rx="6" fill="#fdf6e3" stroke="#93a1a1"/>
  <!-- In plot coordinates the boundaries are y = .4x + 50 and y = 350 - .6x.
       The displayed halfspaces are below these lines (SVG y increases downward). -->
  <g>
    <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333333;0.666667" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="360" y="36" text-anchor="middle" font-size="25" fill="#268bd2">1. The first halfspace H₁</text>
    <g clip-path="url(#plot)">
      <polygon points="50,70 670,318 670,355 50,355" fill="#268bd2" fill-opacity=".22"/>
      <path d="M50 70L670 318" fill="none" stroke="#268bd2" stroke-width="3"/>
    </g>
    <text x="360" y="401" text-anchor="middle" font-size="22" fill="#586e75">x, y ∈ H₁ ⇒ the whole segment lies in H₁.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333333;0.666667" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="360" y="36" text-anchor="middle" font-size="25" fill="#cb4b16">2. The second halfspace H₂</text>
    <g clip-path="url(#plot)">
      <polygon points="50,320 670,-52 670,355 50,355" fill="#cb4b16" fill-opacity=".20"/>
      <path d="M50 320L670 -52" fill="none" stroke="#cb4b16" stroke-width="3"/>
    </g>
    <text x="360" y="401" text-anchor="middle" font-size="22" fill="#586e75">x, y ∈ H₂ ⇒ the whole segment lies in H₂.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333333;0.666667" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="360" y="36" text-anchor="middle" font-size="25" fill="#6c71c4">3. The intersection H₁ ∩ H₂</text>
    <g clip-path="url(#plot)">
      <polygon points="50,320 300,170 670,318 670,355 50,355" fill="#6c71c4" fill-opacity=".26"/>
      <path d="M50 70L670 318" fill="none" stroke="#268bd2" stroke-width="3"/>
      <path d="M50 320L670 -52" fill="none" stroke="#cb4b16" stroke-width="3"/>
    </g>
    <text x="360" y="401" text-anchor="middle" font-size="22" fill="#586e75">The segment lies in both, so it lies in H₁ ∩ H₂.</text>
  </g>
  <!-- This segment stays fixed across all three scenes. -->
  <path d="M200 280L470 250" stroke="#859900" stroke-width="5" stroke-linecap="round"/>
  <g fill="#073642" stroke="#fdf6e3" stroke-width="2">
    <circle cx="200" cy="280" r="7"/>
    <circle cx="470" cy="250" r="7"/>
  </g>
  <g font-size="24" font-style="italic" fill="#073642">
    <text x="180" y="310">x</text>
    <text x="480" y="245">y</text>
  </g>
  <circle cx="200" cy="280" r="6" fill="#859900" stroke="#fdf6e3" stroke-width="2">
    <animate attributeName="cx" values="200;470;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="280;250;280" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="360" y="439" text-anchor="middle" font-size="17" fill="#657b83">Same endpoints and segment in every scene · repeats automatically</text>
</svg>
