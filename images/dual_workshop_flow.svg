<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">Each chair uses two metres of wood and one labor hour; each table uses four metres and three hours</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Georgia, serif" stroke-linecap="round" stroke-linejoin="round"><rect x="80" y="12" width="200" height="47" rx="10" fill="#268bd2" fill-opacity=".10" stroke="#268bd2" stroke-width="2"/><text x="180.0" y="41.5" font-size="18" fill="#268bd2" text-anchor="middle">Wood + labor</text><path d="M130 60L90 124" fill="none" stroke="#586e75" stroke-width="2.5" marker-end="url(#arr)"/><path d="M230 60L270 124" fill="none" stroke="#586e75" stroke-width="2.5" marker-end="url(#arr)"/><text x="83" y="89" font-size="16" fill="#586e75" text-anchor="middle">2 m + 1 h</text><text x="277" y="89" font-size="16" fill="#586e75" text-anchor="middle">4 m + 3 h</text><rect x="15" y="133" width="145" height="135" rx="10" fill="#859900" fill-opacity=".10" stroke="#859900" stroke-width="2"/><text x="87.5" y="206.5" font-size="18" fill="#859900" text-anchor="middle"></text><rect x="200" y="133" width="145" height="135" rx="10" fill="#cb4b16" fill-opacity=".10" stroke="#cb4b16" stroke-width="2"/><text x="272.5" y="206.5" font-size="18" fill="#cb4b16" text-anchor="middle"></text><path d="M54 155V211H117M62 211V242M112 211V242M54 185H112V211" fill="none" stroke="#859900" stroke-width="5"/><path d="M226 191H319M235 191V243M309 191V243" fill="none" stroke="#cb4b16" stroke-width="5"/><text x="87" y="287" font-size="18" fill="#859900" text-anchor="middle">Chair: $40</text><text x="272" y="287" font-size="18" fill="#cb4b16" text-anchor="middle">Table: $90</text><text x="180" y="328" font-size="17" fill="#586e75" text-anchor="middle">Available: 80 m wood, 50 h labor</text></g></svg>