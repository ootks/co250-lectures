<svg xmlns="http://www.w3.org/2000/svg" width="350" height="320" viewBox="0 0 350 320" role="img" aria-labelledby="title desc"><title id="title">Separating hyperplane proof: step 1</title><desc id="desc">In two dimensions, green nearest points join a blue polygon to an orange polygon. A dashed violet line bisects the segment; its normal arrow points from the blue set toward the orange set.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#586e75" /></marker></defs><polygon points="40,110 140,110 140,200 40,200" fill="#268bd2" fill-opacity=".22" stroke="#268bd2" stroke-width="2.5" stroke-linejoin="round" /><polygon points="240,150 320,260 230,245" fill="#cb4b16" fill-opacity=".22" stroke="#cb4b16" stroke-width="2.5" stroke-linejoin="round" /><path d="M140 150L240 150" fill="none" stroke="#859900" stroke-width="3" /><path d="M190 40L190 285" fill="none" stroke="#6c71c4" stroke-width="3" stroke-dasharray="8 5" /><circle cx="140" cy="150" r="6" fill="#859900" stroke="#fdf6e3" stroke-width="2" /><circle cx="240" cy="150" r="6" fill="#859900" stroke="#fdf6e3" stroke-width="2" /><path d="M190 137H203V150" fill="none" stroke="#586e75" stroke-width="1.5" /><g font-family="Georgia, serif" font-style="italic" font-size="19" paint-order="stroke" stroke="#fdf6e3" stroke-width="3" stroke-linejoin="round"><text x="126" y="142" fill="#586e75">p</text><text x="241" y="138" fill="#586e75">q</text></g></svg>