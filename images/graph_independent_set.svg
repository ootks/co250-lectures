<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340" font-family="Georgia, serif">

  <!-- Same graph as graph_example.svg: vertices a-e -->
  <!-- a(200,60) b(90,150) c(310,150) d(150,280) e(250,280) -->
  <!-- Edges: a-b, a-c, b-c, b-d, c-e, d-e, a-e -->
  <g stroke="#586e75" stroke-width="2.5">
    <line x1="200" y1="60"  x2="90"  y2="150"/>
    <line x1="200" y1="60"  x2="310" y2="150"/>
    <line x1="90"  y1="150" x2="310" y2="150"/>
    <line x1="90"  y1="150" x2="150" y2="280"/>
    <line x1="310" y1="150" x2="250" y2="280"/>
    <line x1="150" y1="280" x2="250" y2="280"/>
    <line x1="200" y1="60"  x2="250" y2="280"/>
  </g>

  <!-- Independent set {a, d} highlighted in green; a and d share no edge -->
  <g fill="#859900" stroke="#556100" stroke-width="3">
    <circle cx="200" cy="60"  r="22"/>
    <circle cx="150" cy="280" r="22"/>
  </g>
  <!-- Remaining vertices in muted blue -->
  <g fill="#93a1a1" stroke="#657b83" stroke-width="2">
    <circle cx="90"  cy="150" r="22"/>
    <circle cx="310" cy="150" r="22"/>
    <circle cx="250" cy="280" r="22"/>
  </g>

  <!-- Vertex labels -->
  <g fill="white" font-size="20" text-anchor="middle" font-weight="bold">
    <text x="200" y="67">a</text>
    <text x="90"  y="157">b</text>
    <text x="310" y="157">c</text>
    <text x="150" y="287">d</text>
    <text x="250" y="287">e</text>
  </g>

  <!-- Legend -->
  <g font-size="14" fill="#586e75">
    <circle cx="28" cy="316" r="9" fill="#859900" stroke="#556100" stroke-width="2"/>
    <text x="44" y="321">in the independent set</text>
  </g>
</svg>
