<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" width="760" height="545" font-family="Georgia, serif">
  <!-- Flow chart of the primal-dual algorithm for min cost bipartite perfect matching. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657b83"/>
    </marker>
  </defs>

  <!-- ===================== edges ===================== -->
  <g stroke="#657b83" stroke-width="2" fill="none">
    <!-- initialize -> equality edges -->
    <path d="M 300 64 L 300 94" marker-end="url(#arr)"/>
    <!-- equality edges -> decision -->
    <path d="M 300 144 L 300 174" marker-end="url(#arr)"/>
    <!-- decision -> output (yes, right) -->
    <path d="M 450 226 L 560 226" marker-end="url(#arr)"/>
    <!-- decision -> deficient set (no, down) -->
    <path d="M 300 276 L 300 314" marker-end="url(#arr)"/>
    <!-- deficient set -> step size -->
    <path d="M 300 364 L 300 394" marker-end="url(#arr)"/>
    <!-- step size -> update y -->
    <path d="M 300 444 L 300 474" marker-end="url(#arr)"/>
    <!-- update y -> loop back to equality edges -->
    <path d="M 150 499 L 50 499 L 50 119 L 148 119" marker-end="url(#arr)"/>
  </g>

  <!-- edge labels -->
  <g font-size="14" fill="#586e75" font-style="italic">
    <text x="505" y="216" text-anchor="middle">yes</text>
    <text x="312" y="300">no</text>
    <text x="58" y="310">loop</text>
  </g>

  <!-- ===================== nodes ===================== -->
  <!-- initialize -->
  <rect x="200" y="18" width="200" height="46" rx="23" ry="23"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="46" text-anchor="middle" font-size="14" fill="#073642">Start with <tspan font-style="italic">y</tspan> = 0</text>

  <!-- equality edges process -->
  <rect x="150" y="96" width="300" height="48" rx="6" ry="6"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="116" text-anchor="middle" font-size="14" fill="#073642">Find the equality edges <tspan font-style="italic">E</tspan><tspan dy="-6" font-size="11">=</tspan><tspan dy="6">:</tspan></text>
  <text x="300" y="134" text-anchor="middle" font-size="14" fill="#073642">edges <tspan font-style="italic">uv</tspan> with <tspan font-style="italic">c</tspan><tspan dy="4" font-size="10" font-style="italic">uv</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic">y</tspan><tspan dy="4" font-size="10" font-style="italic">u</tspan><tspan dy="-4"> + </tspan><tspan font-style="italic">y</tspan><tspan dy="4" font-size="10" font-style="italic">v</tspan></text>

  <!-- decision: diamond -->
  <polygon points="300,176 450,226 300,276 150,226"
           fill="#268bd2" fill-opacity="0.18" stroke="#268bd2" stroke-width="2"/>
  <text x="300" y="222" text-anchor="middle" font-size="14" fill="#073642">Does <tspan font-style="italic">E</tspan><tspan dy="-6" font-size="11">=</tspan><tspan dy="6"> contain a</tspan></text>
  <text x="300" y="240" text-anchor="middle" font-size="14" fill="#073642">perfect matching <tspan font-style="italic">M</tspan>?</text>

  <!-- output terminal -->
  <rect x="560" y="198" width="184" height="56" rx="28" ry="28"
        fill="#859900" fill-opacity="0.18" stroke="#859900" stroke-width="2"/>
  <text x="652" y="222" text-anchor="middle" font-size="13.5" fill="#073642">Output <tspan font-style="italic">M</tspan> as a minimum</text>
  <text x="652" y="239" text-anchor="middle" font-size="13.5" fill="#073642">cost perfect matching</text>

  <!-- deficient set process -->
  <rect x="150" y="316" width="300" height="48" rx="6" ry="6"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="336" text-anchor="middle" font-size="14" fill="#073642">Find a deficient set <tspan font-style="italic">S</tspan> using only <tspan font-style="italic">E</tspan><tspan dy="-6" font-size="11">=</tspan><tspan dy="6">,</tspan></text>
  <text x="300" y="354" text-anchor="middle" font-size="14" fill="#073642">and its neighbours <tspan font-style="italic">N</tspan> along <tspan font-style="italic">E</tspan><tspan dy="-6" font-size="11">=</tspan></text>

  <!-- step size process -->
  <rect x="150" y="396" width="300" height="48" rx="6" ry="6"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="416" text-anchor="middle" font-size="14" fill="#073642"><tspan font-style="italic">t</tspan> = smallest reduced cost <tspan font-style="italic">c</tspan><tspan dy="4" font-size="10" font-style="italic">uv</tspan><tspan dy="-4"> &#8722; </tspan><tspan font-style="italic">y</tspan><tspan dy="4" font-size="10" font-style="italic">u</tspan><tspan dy="-4"> &#8722; </tspan><tspan font-style="italic">y</tspan><tspan dy="4" font-size="10" font-style="italic">v</tspan></text>
  <text x="300" y="434" text-anchor="middle" font-size="14" fill="#073642">over edges <tspan font-style="italic">uv</tspan> with <tspan font-style="italic">u</tspan> &#8712; <tspan font-style="italic">S</tspan> and <tspan font-style="italic">v</tspan> &#8713; <tspan font-style="italic">N</tspan></text>

  <!-- update y process -->
  <rect x="150" y="476" width="300" height="48" rx="6" ry="6"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="496" text-anchor="middle" font-size="14" fill="#073642">Add <tspan font-style="italic">t</tspan> to <tspan font-style="italic">y</tspan><tspan dy="4" font-size="10" font-style="italic">v</tspan><tspan dy="-4"> for every </tspan><tspan font-style="italic">v</tspan> &#8712; <tspan font-style="italic">S</tspan>,</text>
  <text x="300" y="514" text-anchor="middle" font-size="14" fill="#073642">subtract <tspan font-style="italic">t</tspan> from <tspan font-style="italic">y</tspan><tspan dy="4" font-size="10" font-style="italic">v</tspan><tspan dy="-4"> for every </tspan><tspan font-style="italic">v</tspan> &#8712; <tspan font-style="italic">N</tspan></text>
</svg>
