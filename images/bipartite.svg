<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" font-family="Georgia, serif">

  <!-- Two vertex groups: left column (blue) at x=110, right column (yellow) at x=290 -->
  <!-- Left rows y: 80, 160, 240, 320   Right rows y: 110, 210, 310 -->

  <!-- Edges only go between the two sides -->
  <g stroke="#586e75" stroke-width="2.5">
    <line x1="110" y1="80"  x2="290" y2="110"/>
    <line x1="110" y1="80"  x2="290" y2="210"/>
    <line x1="110" y1="160" x2="290" y2="110"/>
    <line x1="110" y1="160" x2="290" y2="310"/>
    <line x1="110" y1="240" x2="290" y2="210"/>
    <line x1="110" y1="240" x2="290" y2="310"/>
    <line x1="110" y1="320" x2="290" y2="210"/>
  </g>

  <!-- Left part U -->
  <g fill="#268bd2" stroke="#0d5a8a" stroke-width="2">
    <circle cx="110" cy="80"  r="20"/>
    <circle cx="110" cy="160" r="20"/>
    <circle cx="110" cy="240" r="20"/>
    <circle cx="110" cy="320" r="20"/>
  </g>
  <g fill="white" font-size="17" text-anchor="middle" font-weight="bold">
    <text x="110" y="86">u1</text>
    <text x="110" y="166">u2</text>
    <text x="110" y="246">u3</text>
    <text x="110" y="326">u4</text>
  </g>

  <!-- Right part V -->
  <g fill="#b58900" stroke="#7a5c00" stroke-width="2">
    <circle cx="290" cy="110" r="20"/>
    <circle cx="290" cy="210" r="20"/>
    <circle cx="290" cy="310" r="20"/>
  </g>
  <g fill="white" font-size="17" text-anchor="middle" font-weight="bold">
    <text x="290" y="116">v1</text>
    <text x="290" y="216">v2</text>
    <text x="290" y="316">v3</text>
  </g>

  <!-- Part labels -->
  <text x="110" y="30" text-anchor="middle" font-size="18" fill="#073642" font-weight="bold">V1</text>
  <text x="290" y="30" text-anchor="middle" font-size="18" fill="#073642" font-weight="bold">V2</text>
</svg>
