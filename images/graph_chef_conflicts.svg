<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" font-family="Georgia, serif">
  <!-- Chefs vs shifts. Every shift needs exactly one chef, so shifts are single vertices. -->
  <!-- Instance: C1 (d=2), C2 (d=1) ; S1, S2, S3 (each needs 1 chef). Conflict: C2 cannot work S1. -->
  <!-- Left chefs x=130 rows 130,230 ; Right shifts x=290 rows 80,170,260 -->

  <text x="130" y="46" text-anchor="middle" font-size="16" fill="#073642" font-weight="bold">Chefs</text>
  <text x="290" y="46" text-anchor="middle" font-size="16" fill="#073642" font-weight="bold">Shifts</text>

  <!-- allowed edges: C1-S1, C1-S2, C1-S3, C2-S2, C2-S3 -->
  <g stroke="#586e75" stroke-width="2.5">
    <line x1="156" y1="130" x2="264" y2="80"/>   <!-- C1-S1 -->
    <line x1="156" y1="130" x2="264" y2="170"/>  <!-- C1-S2 -->
    <line x1="156" y1="130" x2="264" y2="260"/>  <!-- C1-S3 -->
    <line x1="156" y1="230" x2="264" y2="170"/>  <!-- C2-S2 -->
    <line x1="156" y1="230" x2="264" y2="260"/>  <!-- C2-S3 -->
  </g>

  <!-- conflict edge C2-S1 shown as removed (dashed red) -->
  <g stroke="#dc322f" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7">
    <line x1="156" y1="230" x2="264" y2="80"/>   <!-- C2-S1 (forbidden) -->
  </g>

  <!-- chefs -->
  <g fill="#268bd2" stroke="#0d5a8a" stroke-width="2">
    <circle cx="130" cy="130" r="24"/>
    <circle cx="130" cy="230" r="24"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="130" y="135">C1</text>
    <text x="130" y="235">C2</text>
  </g>
  <g fill="#586e75" font-size="13" text-anchor="end" font-style="italic">
    <text x="96" y="135">d=2</text>
    <text x="96" y="235">d=1</text>
  </g>

  <!-- shifts (single vertices) -->
  <g fill="#b58900" stroke="#7a5c00" stroke-width="2">
    <circle cx="290" cy="80"  r="24"/>
    <circle cx="290" cy="170" r="24"/>
    <circle cx="290" cy="260" r="24"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="290" y="85">S1</text>
    <text x="290" y="175">S2</text>
    <text x="290" y="265">S3</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#586e75">
    <line x1="60" y1="312" x2="90" y2="312" stroke="#586e75" stroke-width="2.5"/>
    <text x="96" y="317" text-anchor="start">can work</text>
    <line x1="200" y1="312" x2="230" y2="312" stroke="#dc322f" stroke-width="2.5" stroke-dasharray="6 6"/>
    <text x="236" y="317" text-anchor="start">time conflict (no edge)</text>
  </g>
</svg>
