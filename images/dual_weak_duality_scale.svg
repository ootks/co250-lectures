<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">A feasible profit cannot exceed a feasible offer; equality certifies optimality</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Georgia, serif" stroke-linecap="round" stroke-linejoin="round"><path d="M65 307L65 35" fill="none" stroke="#586e75" stroke-width="2.5" marker-end="url(#arr)"/><text x="190" y="25" font-size="22" fill="#586e75" text-anchor="middle">Weak duality</text><path d="M65 95H310M65 245H310" stroke="#164b78" stroke-width="2"/><text x="185" y="80" font-size="19" fill="#164b78" text-anchor="middle">Any dual offer</text><text x="185" y="272" font-size="19" fill="#859900" text-anchor="middle">Any primal profit</text><path d="M150 100L150 163" fill="none" stroke="#164b78" stroke-width="2.5" marker-end="url(#arr)"/><path d="M150 240L150 177" fill="none" stroke="#859900" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="150" cy="170" r="8" fill="#6c71c4"/><text x="175" y="176" font-size="17" fill="#6c71c4" text-anchor="start">same value</text><text x="180" y="315" font-size="18" fill="#586e75" text-anchor="middle">Meeting proves optimality</text></g></svg>