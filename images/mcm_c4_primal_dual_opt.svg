<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Georgia, serif">
<!-- edges: ab (top) and cd (bottom) are the optimal matching, drawn green -->
<line x1="90" y1="80" x2="410" y2="80" stroke="#859900" stroke-width="7" stroke-linecap="round"/>
<line x1="410" y1="80" x2="410" y2="240" stroke="#93a1a1" stroke-width="4" stroke-linecap="round"/>
<line x1="410" y1="240" x2="90" y2="240" stroke="#859900" stroke-width="7" stroke-linecap="round"/>
<line x1="90" y1="240" x2="90" y2="80" stroke="#93a1a1" stroke-width="4" stroke-linecap="round"/>

<!-- edge labels: optimal primal values x*_e, in boxes -->
<rect x="234" y="65" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#859900" stroke-width="2"/>
<text x="250.0" y="88.0" text-anchor="middle" font-size="22" fill="#073642">1</text>
<rect x="394" y="145" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#93a1a1" stroke-width="2"/>
<text x="410.0" y="168.0" text-anchor="middle" font-size="22" fill="#073642">0</text>
<rect x="234" y="225" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#859900" stroke-width="2"/>
<text x="250.0" y="248.0" text-anchor="middle" font-size="22" fill="#073642">1</text>
<rect x="74" y="145" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#93a1a1" stroke-width="2"/>
<text x="90.0" y="168.0" text-anchor="middle" font-size="22" fill="#073642">0</text>

<!-- vertices -->
<circle cx="90" cy="80" r="24" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
<text x="90" y="88" text-anchor="middle" font-size="24" font-style="italic" fill="#073642">a</text>
<circle cx="410" cy="80" r="24" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
<text x="410" y="88" text-anchor="middle" font-size="24" font-style="italic" fill="#073642">b</text>
<circle cx="410" cy="240" r="24" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
<text x="410" y="248" text-anchor="middle" font-size="24" font-style="italic" fill="#073642">c</text>
<circle cx="90" cy="240" r="24" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
<text x="90" y="248" text-anchor="middle" font-size="24" font-style="italic" fill="#073642">d</text>

<!-- dual values y_v next to each vertex, in dual blue -->
<text x="56" y="56" text-anchor="middle" font-size="19" fill="#1f6fd6">y<tspan dy="5" font-size="13" font-style="italic">a</tspan><tspan dy="-5" font-size="19">=0</tspan></text>
<text x="444" y="56" text-anchor="middle" font-size="19" fill="#1f6fd6">y<tspan dy="5" font-size="13" font-style="italic">b</tspan><tspan dy="-5" font-size="19">=1</tspan></text>
<text x="444" y="276" text-anchor="middle" font-size="19" fill="#1f6fd6">y<tspan dy="5" font-size="13" font-style="italic">c</tspan><tspan dy="-5" font-size="19">=0</tspan></text>
<text x="56" y="276" text-anchor="middle" font-size="19" fill="#1f6fd6">y<tspan dy="5" font-size="13" font-style="italic">d</tspan><tspan dy="-5" font-size="19">=2</tspan></text>

<!-- legend -->
<line x1="150" y1="18" x2="178" y2="18" stroke="#859900" stroke-width="6" stroke-linecap="round"/>
<text x="184" y="23" font-size="15" fill="#586e75">primal: optimal x* (edge labels = x*_e)</text>
<rect x="150" y="286" width="16" height="4" rx="2" fill="#1f6fd6"/>
<text x="172" y="294" font-size="15" fill="#1f6fd6">dual: y* at each vertex, value = 3 = cost</text>
</svg>
