<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 50 650 320" width="650" height="320" font-family="Georgia, serif" role="img" aria-labelledby="title desc">
  <title id="title">A segment in the first halfspace</title>
  <desc id="desc">The endpoints x and y and the whole segment joining them lie in the shaded region.</desc>
