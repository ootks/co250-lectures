<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="Georgia, serif">
  <!-- Zoomed in on the optimal vertex: only the corner is shown. -->
  <!-- The two incident edges spread down to the edges of the frame; the feasible region -->
  <!-- is the wedge below the vertex. No other vertices are visible. -->

  <defs>
    <marker id="obj" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc322f"/>
    </marker>
  </defs>

  <!-- feasible region near the vertex: wedge between the two incident edges, open at the bottom -->
  <polygon points="240,70 70,300 410,300"
           fill="#268bd2" fill-opacity="0.14" stroke="none"/>

  <!-- the two incident edges, highlighted -->
  <g stroke="#b58900" stroke-width="5" stroke-linecap="round">
    <line x1="240" y1="70" x2="70"  y2="300"/>
    <line x1="240" y1="70" x2="410" y2="300"/>
  </g>

  <!-- objective direction c, pointing up toward the optimal vertex -->
  <line x1="240" y1="215" x2="240" y2="130" stroke="#dc322f" stroke-width="2.5" marker-end="url(#obj)"/>
  <text x="248" y="178" font-size="15" fill="#dc322f" font-style="italic">c</text>

  <!-- the optimal vertex, emphasized -->
  <circle cx="240" cy="70" r="9" fill="#cb4b16" stroke="#8a3210" stroke-width="2"/>
</svg>
