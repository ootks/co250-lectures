<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" font-family="Georgia, serif">
  <!-- Pivot-rule ambiguity: from the current vertex, two different entering variables
       give two different improving edges, leading to two different neighbouring vertices.
       Pixel map: (x1,x2) -> (70 + 80 x1, 270 - 70 x2). -->

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657b83"/>
    </marker>
    <marker id="chA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c71c4"/>
    </marker>
    <marker id="chB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d33682"/>
    </marker>
  </defs>

  <!-- feasible region: vertices (0,0),(3,0),(4,2),(2,4),(0,3) -->
  <polygon points="70,270 310,270 390,130 230,10 70,60"
           fill="#268bd2" fill-opacity="0.16" stroke="#268bd2" stroke-width="2" stroke-linejoin="round"/>

  <!-- axes -->
  <g stroke="#657b83" stroke-width="1.6">
    <line x1="70" y1="270" x2="500" y2="270" marker-end="url(#ax)"/>
    <line x1="70" y1="270" x2="70"  y2="20"  marker-end="url(#ax)"/>
  </g>
  <text x="504" y="274" font-size="13" fill="#657b83" font-style="italic">x&#8321;</text>
  <text x="54"  y="22"  font-size="13" fill="#657b83" font-style="italic">x&#8322;</text>

  <!-- the two candidate improving edges from the current vertex (0,0) -->
  <!-- choice A: enter x1  -> move to (3,0) -->
  <line x1="70" y1="270" x2="310" y2="270" stroke="#6c71c4" stroke-width="4.5" marker-end="url(#chA)"/>
  <!-- choice B: enter x2  -> move to (0,3) -->
  <line x1="70" y1="270" x2="70" y2="60" stroke="#d33682" stroke-width="4.5" marker-end="url(#chB)"/>

  <!-- vertices -->
  <g fill="#cb4b16" stroke="#8a3210" stroke-width="1.8">
    <circle cx="310" cy="270" r="5.5"/>
    <circle cx="390" cy="130" r="5.5"/>
    <circle cx="230" cy="10"  r="5.5"/>
    <circle cx="70"  cy="60"  r="5.5"/>
  </g>

  <!-- current vertex, emphasized -->
  <circle cx="70" cy="270" r="9.5" fill="#cb4b16" stroke="#073642" stroke-width="2.2"/>
</svg>
