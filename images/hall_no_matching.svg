<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="380" height="320" font-family="Georgia, serif">
  <!-- Bipartite graph with NO perfect matching.
       A = {a1,a2,a3}, B = {b1,b2,b3}.
       Edges: a1-b1, a2-b1, a3-b1, a3-b2, a3-b3.
       a1 and a2 both reach only b1, so no perfect matching. -->
  <!-- Left A x=110 rows 80,160,240 ; Right B x=270 rows 80,160,240 -->

  <g stroke="#586e75" stroke-width="2.5" stroke-linecap="round">
    <line x1="130" y1="80"  x2="250" y2="80"/>   <!-- a1-b1 -->
    <line x1="130" y1="160" x2="250" y2="80"/>   <!-- a2-b1 -->
    <line x1="130" y1="240" x2="250" y2="80"/>   <!-- a3-b1 -->
    <line x1="130" y1="240" x2="250" y2="160"/>  <!-- a3-b2 -->
    <line x1="130" y1="240" x2="250" y2="240"/>  <!-- a3-b3 -->
  </g>

  <!-- left part A -->
  <g fill="#268bd2" stroke="#0d5a8a" stroke-width="2">
    <circle cx="110" cy="80"  r="20"/>
    <circle cx="110" cy="160" r="20"/>
    <circle cx="110" cy="240" r="20"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="110" y="85">a1</text>
    <text x="110" y="165">a2</text>
    <text x="110" y="245">a3</text>
  </g>

  <!-- right part B -->
  <g fill="#b58900" stroke="#7a5c00" stroke-width="2">
    <circle cx="270" cy="80"  r="20"/>
    <circle cx="270" cy="160" r="20"/>
    <circle cx="270" cy="240" r="20"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="270" y="85">b1</text>
    <text x="270" y="165">b2</text>
    <text x="270" y="245">b3</text>
  </g>

  <text x="190" y="300" text-anchor="middle" font-size="15" fill="#586e75">no perfect matching</text>
</svg>
