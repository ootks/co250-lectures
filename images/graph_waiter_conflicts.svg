<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="Georgia, serif">
  <!-- Waiters vs shifts before making copies. A time conflict is a missing edge. -->
  <!-- Instance: W1 (d=2), W2 (d=1) ; S1 (r=1), S2 (r=2). Conflict: W2 cannot work S1. -->
  <!-- Left waiters x=130 rows 110,200 ; Right shifts x=290 rows 110,200 -->

  <text x="130" y="52" text-anchor="middle" font-size="16" fill="#073642" font-weight="bold">Waiters</text>
  <text x="290" y="52" text-anchor="middle" font-size="16" fill="#073642" font-weight="bold">Shifts</text>

  <!-- allowed edges: W1-S1, W1-S2, W2-S2 -->
  <g stroke="#586e75" stroke-width="2.5">
    <line x1="156" y1="110" x2="264" y2="110"/>  <!-- W1-S1 -->
    <line x1="156" y1="110" x2="264" y2="200"/>  <!-- W1-S2 -->
    <line x1="156" y1="200" x2="264" y2="200"/>  <!-- W2-S2 -->
  </g>

  <!-- conflict edge W2-S1 shown as removed (dashed red) -->
  <g stroke="#dc322f" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7">
    <line x1="156" y1="200" x2="264" y2="110"/>  <!-- W2-S1 (forbidden) -->
  </g>

  <!-- waiters -->
  <g fill="#268bd2" stroke="#0d5a8a" stroke-width="2">
    <circle cx="130" cy="110" r="24"/>
    <circle cx="130" cy="200" r="24"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="130" y="115">W1</text>
    <text x="130" y="205">W2</text>
  </g>
  <g fill="#586e75" font-size="13" text-anchor="end" font-style="italic">
    <text x="96" y="115">d=2</text>
    <text x="96" y="205">d=1</text>
  </g>

  <!-- shifts -->
  <g fill="#b58900" stroke="#7a5c00" stroke-width="2">
    <circle cx="290" cy="110" r="24"/>
    <circle cx="290" cy="200" r="24"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="290" y="115">S1</text>
    <text x="290" y="205">S2</text>
  </g>
  <g fill="#586e75" font-size="13" text-anchor="start" font-style="italic">
    <text x="324" y="115">r=1</text>
    <text x="324" y="205">r=2</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#586e75">
    <line x1="60" y1="270" x2="90" y2="270" stroke="#586e75" stroke-width="2.5"/>
    <text x="96" y="275" text-anchor="start">can work</text>
    <line x1="200" y1="270" x2="230" y2="270" stroke="#dc322f" stroke-width="2.5" stroke-dasharray="6 6"/>
    <text x="236" y="275" text-anchor="start">time conflict (no edge)</text>
  </g>
</svg>
