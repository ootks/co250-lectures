<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="title desc">
<title id="title">Three halfplanes intersect in a triangle</title>
<desc id="desc">Blue, orange, and violet transparent halfplanes overlap to form a triangle. Each boundary has its halfplane's color. Each green vertex lies at the intersection of two boundary lines.</desc>
<polygon points="0,0 300,0 300,225 0,255" fill="#268bd2" fill-opacity="0.18"/>
<polygon points="0,0 122.222,0 288.889,300 0,300" fill="#cb4b16" fill-opacity="0.18"/>
<polygon points="175,0 300,0 300,300 25,300" fill="#6c71c4" fill-opacity="0.18"/>
<path d="M0 255L300 225" fill="none" stroke="#268bd2" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M122.222222 0L288.888889 300" fill="none" stroke="#cb4b16" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M25 300L175 0" fill="none" stroke="#6c71c4" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M50 250L250 230" stroke="#268bd2" stroke-width="3.5"/>
<path d="M250 230L150 50" stroke="#cb4b16" stroke-width="3.5"/>
<path d="M150 50L50 250" stroke="#6c71c4" stroke-width="3.5"/>
<circle cx="50" cy="250" r="7" fill="#859900" stroke="#556100" stroke-width="1.8"/>
<circle cx="250" cy="230" r="7" fill="#859900" stroke="#556100" stroke-width="1.8"/>
<circle cx="150" cy="50" r="7" fill="#859900" stroke="#556100" stroke-width="1.8"/>
</svg>
