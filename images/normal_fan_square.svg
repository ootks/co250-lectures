<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280">
  <!-- Left: the unit square with vertices (0,0) orange, (1,0) blue, (1,1) green, (0,1) magenta.
       Right: its normal fan in the plane of objective vectors c: the four closed quadrants,
       each colored by the vertex it maximizes. Quadrant c1>=0,c2>=0 -> (1,1); c1<=0,c2>=0 -> (0,1);
       c1<=0,c2<=0 -> (0,0); c1>=0,c2<=0 -> (1,0). No text. -->
  <!-- square -->
  <polygon points="40,220 200,220 200,60 40,60" fill="#268bd2" fill-opacity="0.16" stroke="#268bd2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="40"  cy="220" r="9" fill="#cb4b16" stroke="#8a3210" stroke-width="2"/>
  <circle cx="200" cy="220" r="9" fill="#268bd2" stroke="#1a5f94" stroke-width="2"/>
  <circle cx="200" cy="60"  r="9" fill="#859900" stroke="#556100" stroke-width="2"/>
  <circle cx="40"  cy="60"  r="9" fill="#d33682" stroke="#8f2358" stroke-width="2"/>

  <!-- fan: four quadrants around the origin (420,140) -->
  <rect x="420" y="20"  width="120" height="120" fill="#859900" fill-opacity="0.45"/>
  <rect x="300" y="20"  width="120" height="120" fill="#d33682" fill-opacity="0.45"/>
  <rect x="300" y="140" width="120" height="120" fill="#cb4b16" fill-opacity="0.45"/>
  <rect x="420" y="140" width="120" height="120" fill="#268bd2" fill-opacity="0.45"/>
  <g stroke="#586e75" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="140" x2="540" y2="140"/>
    <line x1="420" y1="20"  x2="420" y2="260"/>
  </g>
  <rect x="300" y="20" width="240" height="240" fill="none" stroke="#93a1a1" stroke-width="1.5"/>
  <circle cx="420" cy="140" r="6" fill="#586e75"/>
</svg>
