<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="Georgia, serif">
  <!-- A 2D half-space {x : a^T x <= b}: a boundary line, the region shaded on one
       side, and the outward normal a. -->
  <defs>
    <marker id="nrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc322f"/>
    </marker>
  </defs>

  <!-- shaded half-space (below/left of the boundary line), single polygon -->
  <polygon points="0,16.5 271,300 0,300" fill="#268bd2" fill-opacity="0.16"/>

  <!-- boundary line a^T x = b -->
  <line x1="10" y1="27" x2="300" y2="330" stroke="#6c71c4" stroke-width="3"/>

  <!-- outward normal vector a (perpendicular to the line, pointing out of the halfspace) -->
  <!-- line direction ~ (290,303); normal ~ (303,-290) normalized, drawn from a point on the line -->
  <line x1="150" y1="172" x2="210" y2="115" stroke="#dc322f" stroke-width="3" marker-end="url(#nrm)"/>
  <text x="214" y="112" font-size="17" font-style="italic" fill="#b91c1c">a</text>
</svg>
