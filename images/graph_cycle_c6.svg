<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" font-family="Georgia, serif">
  <!-- C6: 6 vertices on a circle, consecutive ones connected -->
  <!-- (160,40) (264,100) (264,220) (160,280) (56,220) (56,100) -->
  <g stroke="#586e75" stroke-width="2.5">
    <line x1="160" y1="40"  x2="264" y2="100"/>
    <line x1="264" y1="100" x2="264" y2="220"/>
    <line x1="264" y1="220" x2="160" y2="280"/>
    <line x1="160" y1="280" x2="56"  y2="220"/>
    <line x1="56"  y1="220" x2="56"  y2="100"/>
    <line x1="56"  y1="100" x2="160" y2="40"/>
  </g>
  <g fill="#2aa198" stroke="#1a6b64" stroke-width="2">
    <circle cx="160" cy="40"  r="18"/>
    <circle cx="264" cy="100" r="18"/>
    <circle cx="264" cy="220" r="18"/>
    <circle cx="160" cy="280" r="18"/>
    <circle cx="56"  cy="220" r="18"/>
    <circle cx="56"  cy="100" r="18"/>
  </g>

  <!-- Vertex numbers -->
  <g fill="white" font-size="18" text-anchor="middle" font-weight="bold">
    <text x="160" y="46">1</text>
    <text x="264" y="106">2</text>
    <text x="264" y="226">3</text>
    <text x="160" y="286">4</text>
    <text x="56"  y="226">5</text>
    <text x="56"  y="106">6</text>
  </g>
</svg>
