<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">Use the same resources either to make furniture or sell directly to a competitor</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Georgia, serif" stroke-linecap="round" stroke-linejoin="round"><rect x="65" y="15" width="230" height="60" rx="10" fill="#268bd2" fill-opacity=".10" stroke="#268bd2" stroke-width="2"/><text x="180.0" y="51.0" font-size="18" fill="#268bd2" text-anchor="middle">Our wood and labor</text><path d="M115 78L90 135" fill="none" stroke="#586e75" stroke-width="2.5" marker-end="url(#arr)"/><path d="M245 78L270 135" fill="none" stroke="#586e75" stroke-width="2.5" marker-end="url(#arr)"/><rect x="10" y="145" width="150" height="70" rx="10" fill="#859900" fill-opacity=".10" stroke="#859900" stroke-width="2"/><text x="85.0" y="186.0" font-size="18" fill="#859900" text-anchor="middle">Make furniture</text><rect x="200" y="145" width="150" height="70" rx="10" fill="#164b78" fill-opacity=".10" stroke="#164b78" stroke-width="2"/><text x="275.0" y="186.0" font-size="18" fill="#164b78" text-anchor="middle">Sell resources</text><text x="85" y="244" font-size="16" fill="#859900" text-anchor="middle">$40 per chair</text><text x="85" y="269" font-size="16" fill="#859900" text-anchor="middle">$90 per table</text><text x="275" y="244" font-size="16" fill="#164b78" text-anchor="middle">u per metre</text><text x="275" y="269" font-size="16" fill="#164b78" text-anchor="middle">v per hour</text><text x="180" y="315" font-size="18" fill="#586e75" text-anchor="middle">Competitor offers at least</text><text x="180" y="339" font-size="18" fill="#586e75" text-anchor="middle">what our furniture can earn</text></g></svg>