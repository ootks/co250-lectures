<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" font-family="Georgia, serif">
  <!-- A polytope (triangle): blue interior, red edges, green vertices. -->

  <!-- interior -->
  <polygon points="50,250 250,230 150,50" fill="#268bd2" fill-opacity="0.18"/>

  <!-- edges -->
  <polygon points="50,250 250,230 150,50" fill="none" stroke="#dc322f" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- vertices -->
  <circle cx="50"  cy="250" r="7" fill="#859900" stroke="#556100" stroke-width="1.8"/>
  <circle cx="250" cy="230" r="7" fill="#859900" stroke="#556100" stroke-width="1.8"/>
  <circle cx="150" cy="50"  r="7" fill="#859900" stroke="#556100" stroke-width="1.8"/>
</svg>
