<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Georgia, serif">
  <!-- Exploded 1-dim faces (edges) of a cube. Projection: +x right, +y depth (up-right), +z up.
       Central cube: solid purple. Edges: red (all 12). -->

  <!-- connectors from each edge to the cube -->
  <g stroke="#93a1a1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="165.1" y1="224.9" x2="56.2"  y2="259.7"/>
    <line x1="179.0" y1="246.0" x2="119.0" y2="306.0"/>
    <line x1="196.1" y1="255.9" x2="147.2" y2="350.7"/>
    <line x1="179.0" y1="184.0" x2="119.0" y2="124.0"/>
    <line x1="196.1" y1="193.9" x2="147.2" y2="168.7"/>
    <line x1="192.9" y1="205.1" x2="181.8" y2="170.3"/>
    <line x1="223.9" y1="236.1" x2="272.8" y2="261.3"/>
    <line x1="223.9" y1="174.1" x2="272.8" y2="79.3"/>
    <line x1="227.1" y1="224.9" x2="238.2" y2="259.7"/>
    <line x1="241.0" y1="246.0" x2="301.0" y2="306.0"/>
    <line x1="241.0" y1="184.0" x2="301.0" y2="124.0"/>
    <line x1="254.9" y1="205.1" x2="363.8" y2="170.3"/>
  </g>

  <!-- central cube: translucent purple, shown in 3D (three visible faces + hidden edges) -->
  <g stroke="#4a4a99" stroke-width="1.5" stroke-linejoin="round">
    <!-- hidden back edges -->
    <g stroke="#9a9ad0" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
      <line x1="192.9" y1="236.1" x2="165.1" y2="255.9"/>
      <line x1="192.9" y1="236.1" x2="254.9" y2="236.1"/>
      <line x1="192.9" y1="236.1" x2="192.9" y2="174.1"/>
    </g>
    <polygon points="165.1,255.9 227.1,255.9 227.1,193.9 165.1,193.9" fill="#6c71c4" fill-opacity="0.4"/>
    <polygon points="227.1,255.9 254.9,236.1 254.9,174.1 227.1,193.9" fill="#6c71c4" fill-opacity="0.3"/>
    <polygon points="165.1,193.9 227.1,193.9 254.9,174.1 192.9,174.1" fill="#6c71c4" fill-opacity="0.5"/>
  </g>

  <!-- exploded edges: red (all 12) -->
  <g stroke="#dc322f" stroke-width="4" stroke-linecap="round">
    <line x1="56.2"  y1="290.7" x2="56.2"  y2="228.7"/>
    <line x1="105.1" y1="315.9" x2="132.9" y2="296.1"/>
    <line x1="116.2" y1="350.7" x2="178.2" y2="350.7"/>
    <line x1="105.1" y1="133.9" x2="132.9" y2="114.1"/>
    <line x1="116.2" y1="168.7" x2="178.2" y2="168.7"/>
    <line x1="181.8" y1="201.3" x2="181.8" y2="139.3"/>
    <line x1="241.8" y1="261.3" x2="303.8" y2="261.3"/>
    <line x1="241.8" y1="79.3"  x2="303.8" y2="79.3"/>
    <line x1="238.2" y1="290.7" x2="238.2" y2="228.7"/>
    <line x1="287.1" y1="315.9" x2="314.9" y2="296.1"/>
    <line x1="287.1" y1="133.9" x2="314.9" y2="114.1"/>
    <line x1="363.8" y1="201.3" x2="363.8" y2="139.3"/>
  </g>
</svg>
