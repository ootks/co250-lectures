<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Georgia, serif">
  <!-- Flow chart of one simplex iteration (loops until optimal or unbounded). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657b83"/>
    </marker>
  </defs>

  <!-- ===================== edges ===================== -->
  <g stroke="#657b83" stroke-width="2" fill="none">
    <!-- start decision -> entering (Yes, down) -->
    <path d="M 300 108 L 300 168" marker-end="url(#arr)"/>
    <!-- start decision -> optimal (No, right) -->
    <path d="M 420 70 L 560 70" marker-end="url(#arr)"/>
    <!-- entering -> unbounded decision -->
    <path d="M 300 212 L 300 268" marker-end="url(#arr)"/>
    <!-- unbounded decision -> unbounded terminal (No, right) -->
    <path d="M 440 310 L 560 310" marker-end="url(#arr)"/>
    <!-- unbounded decision -> ratio test (Yes, down) -->
    <path d="M 300 352 L 300 408" marker-end="url(#arr)"/>
    <!-- ratio test -> update basis -->
    <path d="M 300 452 L 300 508" marker-end="url(#arr)"/>
    <!-- update basis -> loop back to start -->
    <path d="M 180 530 L 70 530 L 70 70 L 180 70" marker-end="url(#arr)"/>
  </g>

  <!-- edge labels -->
  <g font-size="14" fill="#586e75" font-style="italic">
    <text x="312" y="140">yes</text>
    <text x="470" y="60" text-anchor="middle">no</text>
    <text x="470" y="290" text-anchor="middle">no</text>
    <text x="312" y="382">yes</text>
    <text x="78" y="300">loop</text>
  </g>

  <!-- ===================== nodes ===================== -->
  <!-- start decision: diamond -->
  <polygon points="300,34 430,70 300,106 170,70"
           fill="#268bd2" fill-opacity="0.18" stroke="#268bd2" stroke-width="2"/>
  <text x="300" y="66" text-anchor="middle" font-size="14" fill="#073642">Does c have a</text>
  <text x="300" y="84" text-anchor="middle" font-size="14" fill="#073642">positive entry?</text>

  <!-- optimal terminal -->
  <rect x="560" y="46" width="180" height="48" rx="24" ry="24"
        fill="#859900" fill-opacity="0.18" stroke="#859900" stroke-width="2"/>
  <text x="650" y="68" text-anchor="middle" font-size="13.5" fill="#073642">Output current BFS</text>
  <text x="650" y="85" text-anchor="middle" font-size="13.5" fill="#073642">as optimal</text>

  <!-- entering process -->
  <rect x="180" y="168" width="240" height="46" rx="6" ry="6"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="196" text-anchor="middle" font-size="14" fill="#073642">Choose k with c&#8342; &gt; 0 to enter</text>

  <!-- unbounded decision: diamond -->
  <polygon points="300,266 440,310 300,354 160,310"
           fill="#268bd2" fill-opacity="0.18" stroke="#268bd2" stroke-width="2"/>
  <text x="300" y="305" text-anchor="middle" font-size="14" fill="#073642">Does column A&#8342; have</text>
  <text x="300" y="323" text-anchor="middle" font-size="14" fill="#073642">a positive entry?</text>

  <!-- unbounded terminal -->
  <rect x="560" y="286" width="180" height="48" rx="24" ry="24"
        fill="#dc322f" fill-opacity="0.16" stroke="#dc322f" stroke-width="2"/>
  <text x="650" y="315" text-anchor="middle" font-size="13.5" fill="#073642">Output unbounded</text>

  <!-- ratio test process -->
  <rect x="180" y="408" width="240" height="46" rx="6" ry="6"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="430" text-anchor="middle" font-size="14" fill="#073642">Ratio test: choose</text>
  <text x="300" y="447" text-anchor="middle" font-size="14" fill="#073642">leaving variable based on b/ A&#8342;</text>

  <!-- update basis process -->
  <rect x="180" y="508" width="240" height="46" rx="6" ry="6"
        fill="#eee8d5" stroke="#657b83" stroke-width="2"/>
  <text x="300" y="530" text-anchor="middle" font-size="14" fill="#073642">Update basis and</text>
  <text x="300" y="547" text-anchor="middle" font-size="14" fill="#073642">recanonicalize</text>
</svg>
