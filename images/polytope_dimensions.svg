<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="Georgia, serif">
  <!-- Four polytopes of dimension 0,1,2,3 stacked vertically, each shown together
       with its affine hull (the smallest affine subspace containing it), in faint purple. -->

  <!-- ===== dim 0: a point; affine hull = the point itself (0-dim) ===== -->
  <!-- affine hull: just the point, indicated by a faint ring -->
  <circle cx="110" cy="55" r="12" fill="none" stroke="#6c71c4" stroke-width="1.4" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <circle cx="110" cy="55" r="7" fill="#859900" stroke="#556100" stroke-width="1.8"/>
  <text x="175" y="52" font-size="15" fill="#586e75">dim 0</text>
  <text x="175" y="70" font-size="11" fill="#6c71c4">aff hull: a point</text>

  <!-- ===== dim 1: a segment; affine hull = the whole line ===== -->
  <!-- affine hull: the line through the segment, extended -->
  <line x1="20" y1="175" x2="200" y2="175" stroke="#6c71c4" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="60" y1="175" x2="160" y2="175" stroke="#dc322f" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60"  cy="175" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <circle cx="160" cy="175" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <text x="175" y="150" font-size="15" fill="#586e75">dim 1</text>
  <text x="175" y="168" font-size="11" fill="#6c71c4">aff hull: a line</text>

  <!-- ===== dim 2: a filled triangle; affine hull = the whole plane ===== -->
  <!-- affine hull: a plane, shown as a large faint parallelogram behind the triangle -->
  <polygon points="25,360 175,335 205,230 55,255"
           fill="#6c71c4" fill-opacity="0.12" stroke="#6c71c4" stroke-opacity="0.5" stroke-width="1.3"/>
  <polygon points="65,330 160,315 110,255" fill="#268bd2" fill-opacity="0.20" stroke="#dc322f" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="65"  cy="330" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <circle cx="160" cy="315" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <circle cx="110" cy="255" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <text x="220" y="285" font-size="15" fill="#586e75">dim 2</text>
  <text x="212" y="303" font-size="11" fill="#6c71c4">aff hull: a plane</text>

  <!-- ===== dim 3: a tetrahedron; affine hull = all of space ===== -->
  <!-- affine hull: all of R^3, shown as a faint bounding box frame -->
  <g stroke="#6c71c4" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <!-- back rectangle -->
    <polygon points="55,430 165,430 165,520 55,520"/>
    <!-- front rectangle (offset) -->
    <polygon points="85,455 195,455 195,545 85,545"/>
    <!-- connecting edges -->
    <line x1="55" y1="430" x2="85" y2="455"/>
    <line x1="165" y1="430" x2="195" y2="455"/>
    <line x1="165" y1="520" x2="195" y2="545"/>
    <line x1="55" y1="520" x2="85" y2="545"/>
  </g>
  <!-- tetrahedron: apex (120,445), base (80,530),(180,515),(140,485) -->
  <polygon points="120,445 80,530 140,485" fill="#268bd2" fill-opacity="0.10" stroke="#e08a86" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="120,445 80,530 180,515" fill="#268bd2" fill-opacity="0.22" stroke="#dc322f" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="120,445 180,515 140,485" fill="#268bd2" fill-opacity="0.16" stroke="#dc322f" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="120" cy="445" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <circle cx="80"  cy="530" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <circle cx="180" cy="515" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <circle cx="140" cy="485" r="6" fill="#859900" stroke="#556100" stroke-width="1.6"/>
  <text x="225" y="470" font-size="15" fill="#586e75">dim 3</text>
  <text x="214" y="488" font-size="11" fill="#6c71c4">aff hull: space</text>
</svg>
