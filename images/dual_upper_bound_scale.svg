<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">Minimizing the dual lowers upper bounds on primal profit</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Georgia, serif" stroke-linecap="round" stroke-linejoin="round"><path d="M90 325L90 30" fill="none" stroke="#586e75" stroke-width="2.5" marker-end="url(#arr)"/><text x="95" y="20" font-size="19" fill="#586e75" text-anchor="middle">Objective value</text><circle cx="90" cy="65" r="6" fill="#164b78"/><text x="110" y="71" font-size="17" fill="#164b78" text-anchor="start">dual bound</text><circle cx="90" cy="120" r="6" fill="#164b78"/><text x="110" y="126" font-size="17" fill="#164b78" text-anchor="start">better dual bound</text><circle cx="90" cy="220" r="6" fill="#859900"/><text x="110" y="226" font-size="17" fill="#859900" text-anchor="start">feasible profit</text><circle cx="90" cy="280" r="6" fill="#859900"/><text x="110" y="286" font-size="17" fill="#859900" text-anchor="start">feasible profit</text><path d="M280 67L280 116" fill="none" stroke="#164b78" stroke-width="2.5" marker-end="url(#arr)"/><text x="185" y="180" font-size="17" fill="#586e75" text-anchor="middle">Every bound stays above</text><text x="185" y="200" font-size="17" fill="#586e75" text-anchor="middle">every feasible profit</text></g></svg>