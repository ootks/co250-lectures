<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="Georgia, serif">
  <!-- Zoomed-out NONCONVEX region. The vertex A is a local optimum (both incident edges -->
  <!-- go downhill in the objective direction), yet a reflex (nonconvex) notch hides a -->
  <!-- different vertex G that is higher up and so has a strictly better objective value. -->

  <defs>
    <marker id="obj" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc322f"/>
    </marker>
  </defs>

  <!-- nonconvex polygon: A(240,90) -> (110,160) -> (150,270) -> (360,270) -> G(390,55) -> reflex(300,150) -> A -->
  <polygon points="240,90 110,160 150,270 360,270 390,55 300,150"
           fill="#268bd2" fill-opacity="0.14" stroke="#268bd2" stroke-width="2" stroke-linejoin="round"/>

  <!-- the two edges incident to the local optimum A, highlighted -->
  <g stroke="#b58900" stroke-width="5" stroke-linecap="round">
    <line x1="240" y1="90" x2="110" y2="160"/>
    <line x1="240" y1="90" x2="300" y2="150"/>
  </g>

  <!-- objective direction c, pointing up (higher = better) -->
  <line x1="60" y1="230" x2="60" y2="120" stroke="#dc322f" stroke-width="2.5" marker-end="url(#obj)"/>
  <text x="68" y="175" font-size="15" fill="#dc322f" font-style="italic">c</text>

  <!-- local optimum vertex A -->
  <circle cx="240" cy="90" r="8" fill="#cb4b16" stroke="#8a3210" stroke-width="2"/>
  <text x="196" y="86" font-size="13" fill="#cb4b16" text-anchor="end">local opt</text>

  <!-- the strictly better vertex G -->
  <circle cx="390" cy="55" r="8" fill="#859900" stroke="#556100" stroke-width="2"/>
  <text x="400" y="52" font-size="13" fill="#556100">better</text>
</svg>
