<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Georgia, serif">
  <!--
    Nonuniqueness: a 4-cycle a-b-c-d with all edge costs equal to 1.
    Both perfect matchings {ab, cd} and {bc, da} have cost 2, so they are both
    optimal. Their midpoint x = 1/2 on every edge is a fractional optimal LP
    solution (also cost 2). Three panels: the two integral optima and the
    fractional average.
    Panel-local coordinates: a=(70,50) b=(230,50) c=(230,210) d=(70,210).
  -->

  <!-- ============ Panel 1: matching {ab, cd} ============ -->
  <g transform="translate(10,10)">
    <!-- edges: ab and cd selected (green), bc and da unselected (gray) -->
    <line x1="70"  y1="50"  x2="230" y2="50"  stroke="#859900" stroke-width="8" stroke-linecap="round"/>
    <line x1="230" y1="50"  x2="230" y2="210" stroke="#93a1a1" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="210" x2="70"  y2="210" stroke="#859900" stroke-width="8" stroke-linecap="round"/>
    <line x1="70"  y1="210" x2="70"  y2="50"  stroke="#93a1a1" stroke-width="4" stroke-linecap="round"/>
    <!-- x-values -->
    <rect x="134" y="35"  width="32" height="30" rx="8" fill="#fdf6e3" stroke="#859900" stroke-width="2"/>
    <text x="150" y="58"  text-anchor="middle" font-size="20" fill="#073642">1</text>
    <rect x="214" y="115" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#93a1a1" stroke-width="2"/>
    <text x="230" y="138" text-anchor="middle" font-size="20" fill="#073642">0</text>
    <rect x="134" y="195" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#859900" stroke-width="2"/>
    <text x="150" y="218" text-anchor="middle" font-size="20" fill="#073642">1</text>
    <rect x="54"  y="115" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#93a1a1" stroke-width="2"/>
    <text x="70"  y="138" text-anchor="middle" font-size="20" fill="#073642">0</text>
    <!-- vertices -->
    <circle cx="70"  cy="50"  r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="70"  y="58"  text-anchor="middle" font-size="22" font-style="italic" fill="#073642">a</text>
    <circle cx="230" cy="50"  r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="230" y="58"  text-anchor="middle" font-size="22" font-style="italic" fill="#073642">b</text>
    <circle cx="230" cy="210" r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="230" y="218" text-anchor="middle" font-size="22" font-style="italic" fill="#073642">c</text>
    <circle cx="70"  cy="210" r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="70"  y="218" text-anchor="middle" font-size="22" font-style="italic" fill="#073642">d</text>
    <text x="150" y="270" text-anchor="middle" font-size="18" fill="#586e75">{ab, cd}, cost 2</text>
  </g>

  <!-- ============ Panel 2: matching {bc, da} ============ -->
  <g transform="translate(310,10)">
    <line x1="70"  y1="50"  x2="230" y2="50"  stroke="#93a1a1" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="50"  x2="230" y2="210" stroke="#859900" stroke-width="8" stroke-linecap="round"/>
    <line x1="230" y1="210" x2="70"  y2="210" stroke="#93a1a1" stroke-width="4" stroke-linecap="round"/>
    <line x1="70"  y1="210" x2="70"  y2="50"  stroke="#859900" stroke-width="8" stroke-linecap="round"/>
    <rect x="134" y="35"  width="32" height="30" rx="8" fill="#fdf6e3" stroke="#93a1a1" stroke-width="2"/>
    <text x="150" y="58"  text-anchor="middle" font-size="20" fill="#073642">0</text>
    <rect x="214" y="115" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#859900" stroke-width="2"/>
    <text x="230" y="138" text-anchor="middle" font-size="20" fill="#073642">1</text>
    <rect x="134" y="195" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#93a1a1" stroke-width="2"/>
    <text x="150" y="218" text-anchor="middle" font-size="20" fill="#073642">0</text>
    <rect x="54"  y="115" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#859900" stroke-width="2"/>
    <text x="70"  y="138" text-anchor="middle" font-size="20" fill="#073642">1</text>
    <circle cx="70"  cy="50"  r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="70"  y="58"  text-anchor="middle" font-size="22" font-style="italic" fill="#073642">a</text>
    <circle cx="230" cy="50"  r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="230" y="58"  text-anchor="middle" font-size="22" font-style="italic" fill="#073642">b</text>
    <circle cx="230" cy="210" r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="230" y="218" text-anchor="middle" font-size="22" font-style="italic" fill="#073642">c</text>
    <circle cx="70"  cy="210" r="22" fill="#d5e8a8" stroke="#859900" stroke-width="4"/>
    <text x="70"  y="218" text-anchor="middle" font-size="22" font-style="italic" fill="#073642">d</text>
    <text x="150" y="270" text-anchor="middle" font-size="18" fill="#586e75">{bc, da}, cost 2</text>
  </g>

  <!-- ============ Panel 3: fractional optimum x = 1/2 everywhere ============ -->
  <g transform="translate(610,10)">
    <line x1="70"  y1="50"  x2="230" y2="50"  stroke="#cb4b16" stroke-width="7" stroke-linecap="round"/>
    <line x1="230" y1="50"  x2="230" y2="210" stroke="#cb4b16" stroke-width="7" stroke-linecap="round"/>
    <line x1="230" y1="210" x2="70"  y2="210" stroke="#cb4b16" stroke-width="7" stroke-linecap="round"/>
    <line x1="70"  y1="210" x2="70"  y2="50"  stroke="#cb4b16" stroke-width="7" stroke-linecap="round"/>
    <rect x="134" y="35"  width="32" height="30" rx="8" fill="#fdf6e3" stroke="#cb4b16" stroke-width="2"/>
    <text x="150" y="58"  text-anchor="middle" font-size="20" fill="#073642">&#189;</text>
    <rect x="214" y="115" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#cb4b16" stroke-width="2"/>
    <text x="230" y="138" text-anchor="middle" font-size="20" fill="#073642">&#189;</text>
    <rect x="134" y="195" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#cb4b16" stroke-width="2"/>
    <text x="150" y="218" text-anchor="middle" font-size="20" fill="#073642">&#189;</text>
    <rect x="54"  y="115" width="32" height="30" rx="8" fill="#fdf6e3" stroke="#cb4b16" stroke-width="2"/>
    <text x="70"  y="138" text-anchor="middle" font-size="20" fill="#073642">&#189;</text>
    <circle cx="70"  cy="50"  r="22" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
    <text x="70"  y="58"  text-anchor="middle" font-size="22" font-style="italic" fill="#073642">a</text>
    <circle cx="230" cy="50"  r="22" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
    <text x="230" y="58"  text-anchor="middle" font-size="22" font-style="italic" fill="#073642">b</text>
    <circle cx="230" cy="210" r="22" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
    <text x="230" y="218" text-anchor="middle" font-size="22" font-style="italic" fill="#073642">c</text>
    <circle cx="70"  cy="210" r="22" fill="#eee8d5" stroke="#586e75" stroke-width="4"/>
    <text x="70"  y="218" text-anchor="middle" font-size="22" font-style="italic" fill="#073642">d</text>
    <text x="150" y="270" text-anchor="middle" font-size="18" fill="#586e75">average: x = &#189; on all edges, cost 2</text>
  </g>
</svg>
