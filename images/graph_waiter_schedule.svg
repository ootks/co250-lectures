<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Georgia, serif">
  <!-- Waiter scheduling as a bipartite degree-constrained subgraph -->
  <!-- Waiters left x=140 rows 90,180,270 ; Shifts right x=340 rows 60,140,220,300 -->

  <!-- Column headings -->
  <text x="140" y="34" text-anchor="middle" font-size="16" fill="#073642" font-weight="bold">Waiters</text>
  <text x="340" y="34" text-anchor="middle" font-size="16" fill="#073642" font-weight="bold">Shifts</text>

  <!-- chosen schedule edges (bold green) -->
  <!-- W1(140,90): S1(340,60), S3(340,220) -->
  <!-- W2(140,180): S1(340,60), S4(340,300) -->
  <!-- W3(140,270): S2(340,140), S3(340,220), S4(340,300) -->
  <g stroke="#859900" stroke-width="4">
    <line x1="164" y1="90"  x2="316" y2="60"/>
    <line x1="164" y1="90"  x2="316" y2="220"/>
    <line x1="164" y1="180" x2="316" y2="60"/>
    <line x1="164" y1="180" x2="316" y2="300"/>
    <line x1="164" y1="270" x2="316" y2="140"/>
    <line x1="164" y1="270" x2="316" y2="220"/>
    <line x1="164" y1="270" x2="316" y2="300"/>
  </g>

  <!-- waiters -->
  <g fill="#268bd2" stroke="#0d5a8a" stroke-width="2">
    <circle cx="140" cy="90"  r="24"/>
    <circle cx="140" cy="180" r="24"/>
    <circle cx="140" cy="270" r="24"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="140" y="95">W1</text>
    <text x="140" y="185">W2</text>
    <text x="140" y="275">W3</text>
  </g>
  <!-- required days d_i, to the left of each waiter -->
  <g fill="#586e75" font-size="14" text-anchor="end">
    <text x="104" y="95">d=2</text>
    <text x="104" y="185">d=2</text>
    <text x="104" y="275">d=3</text>
  </g>

  <!-- shifts -->
  <g fill="#b58900" stroke="#7a5c00" stroke-width="2">
    <circle cx="340" cy="60"  r="24"/>
    <circle cx="340" cy="140" r="24"/>
    <circle cx="340" cy="220" r="24"/>
    <circle cx="340" cy="300" r="24"/>
  </g>
  <g fill="white" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="340" y="65">S1</text>
    <text x="340" y="145">S2</text>
    <text x="340" y="225">S3</text>
    <text x="340" y="305">S4</text>
  </g>
  <!-- required staffing r_j, to the right of each shift -->
  <g fill="#586e75" font-size="14" text-anchor="start">
    <text x="376" y="65">r=2</text>
    <text x="376" y="145">r=1</text>
    <text x="376" y="225">r=2</text>
    <text x="376" y="305">r=2</text>
  </g>
</svg>
