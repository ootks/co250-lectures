<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Georgia, serif">
  <!-- Simplex walk from the BFS (0,0,3,2) to (1,1,0,0) along edges of the feasible region. -->
  <!-- Pixel map: (x1,x2) -> (70 + 80 x1, 250 - 90 x2). -->

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657b83"/>
    </marker>
    <marker id="walk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c71c4"/>
    </marker>
  </defs>

  <!-- feasible region -->
  <polygon points="70,250 230,250 150,160 70,115"
           fill="#268bd2" fill-opacity="0.16" stroke="#268bd2" stroke-width="2" stroke-linejoin="round"/>

  <!-- constraint lines -->
  <line x1="246" y1="268" x2="54" y2="52" stroke="#859900" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="334" y1="259" x2="54" y2="106" stroke="#b58900" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- axes -->
  <g stroke="#657b83" stroke-width="1.6">
    <line x1="70" y1="250" x2="470" y2="250" marker-end="url(#ax)"/>
    <line x1="70" y1="250" x2="70"  y2="30"  marker-end="url(#ax)"/>
  </g>
  <text x="474" y="254" font-size="13" fill="#657b83" font-style="italic">x&#8321;  (x&#8322;=0)</text>
  <text x="42"  y="28"  font-size="13" fill="#657b83" font-style="italic">x&#8322;  (x&#8321;=0)</text>

  <!-- axis ticks -->
  <g stroke="#657b83" stroke-width="1" font-size="11" fill="#657b83">
    <line x1="150" y1="247" x2="150" y2="253"/>
    <line x1="230" y1="247" x2="230" y2="253"/>
    <line x1="310" y1="247" x2="310" y2="253"/>
    <line x1="67"  y1="160" x2="73"  y2="160"/>
    <line x1="67"  y1="70"  x2="73"  y2="70"/>
  </g>

  <!-- THE WALK: (1,1)->(2,0)->(0,0), drawn as two directed edges -->
  <line x1="150" y1="160" x2="230" y2="250" stroke="#6c71c4" stroke-width="4" marker-end="url(#walk)"/>
  <line x1="230" y1="250" x2="70"  y2="250" stroke="#6c71c4" stroke-width="4" marker-end="url(#walk)"/>

  <!-- step labels along the walk -->
  <g font-size="12" fill="#4a4aa0" font-style="italic">
    <text x="203" y="200" text-anchor="middle">step 1</text>
    <text x="150" y="240" text-anchor="middle">step 2</text>
  </g>

  <!-- feasible basic solutions -->
  <g fill="#cb4b16" stroke="#8a3210" stroke-width="1.8">
    <circle cx="70"  cy="250" r="5.5"/>
    <circle cx="230" cy="250" r="5.5"/>
    <circle cx="150" cy="160" r="5.5"/>
    <circle cx="70"  cy="115" r="5.5"/>
  </g>

  <!-- infeasible basic solutions -->
  <g fill="none" stroke="#dc322f" stroke-width="2">
    <circle cx="70"  cy="70"  r="5.5"/>
    <circle cx="310" cy="250" r="5.5"/>
  </g>

  <!-- endpoints of the walk, emphasized -->
  <circle cx="70"  cy="250" r="9" fill="none" stroke="#6c71c4" stroke-width="2"/>
  <circle cx="150" cy="160" r="9" fill="none" stroke="#6c71c4" stroke-width="2"/>

  <!-- full basic-solution labels -->
  <g font-size="12" fill="#586e75">
    <text x="60"  y="268" text-anchor="end">(0, 0, 3, 2)</text>
    <text x="238" y="245">(2, 0, 1, 0)</text>
    <text x="162" y="156">(1, 1, 0, 0)</text>
    <text x="82"  y="112">(0, 3/2, 0, 1/2)</text>
    <text x="82"  y="66">(0, 2, -1, 0)</text>
    <text x="318" y="245">(3, 0, 0, -1)</text>
  </g>

  <!-- caption of the walk -->
  <text x="300" y="110" font-size="12.5" fill="#4a4aa0">walk: (1,1,0,0) &#8594; (2,0,1,0) &#8594; (0,0,3,2)</text>
</svg>
