<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" font-family="Georgia, serif">
  <!-- Chef scheduling as a perfect matching by copying chefs only. -->
  <!-- Every shift needs exactly one chef, so shifts stay single vertices. -->
  <!-- Instance: C1 (d=2), C2 (d=1) ; S1, S2, S3. Conflict: C2 cannot work S1. -->
  <!-- Left chef copies x=150: C1a(80) C1b(160) C2a(260) -->
  <!-- Right shifts x=310: S1(80) S2(170) S3(260) -->

  <text x="150" y="34" text-anchor="middle" font-size="15" fill="#073642" font-weight="bold">Chef copies</text>
  <text x="310" y="34" text-anchor="middle" font-size="15" fill="#073642" font-weight="bold">Shifts</text>

  <!-- allowed (compatible) edges, faint. C2a only reaches S2, S3 (conflict with S1). -->
  <g stroke="#d8d0bb" stroke-width="2">
    <line x1="176" y1="80"  x2="284" y2="170"/>  <!-- C1a-S2 -->
    <line x1="176" y1="80"  x2="284" y2="260"/>  <!-- C1a-S3 -->
    <line x1="176" y1="160" x2="284" y2="80"/>   <!-- C1b-S1 -->
    <line x1="176" y1="160" x2="284" y2="260"/>  <!-- C1b-S3 -->
    <line x1="176" y1="260" x2="284" y2="170"/>  <!-- C2a-S2 -->
  </g>

  <!-- matching edges (bold green): C1a-S1, C1b-S2, C2a-S3 -->
  <g stroke="#099d04" stroke-width="4.5">
    <line x1="176" y1="80"  x2="284" y2="80"/>
    <line x1="176" y1="160" x2="284" y2="170"/>
    <line x1="176" y1="260" x2="284" y2="260"/>
  </g>

  <!-- grouping labels: which copies belong to which chef -->
  <text x="104" y="124" text-anchor="middle" font-size="13" fill="#586e75" font-style="italic">C1 (d=2)</text>
  <text x="104" y="266" text-anchor="middle" font-size="13" fill="#586e75" font-style="italic">C2 (d=1)</text>

  <!-- chef copies -->
  <g fill="#268bd2" stroke="#0d5a8a" stroke-width="2">
    <circle cx="150" cy="80"  r="22"/>
    <circle cx="150" cy="160" r="22"/>
    <circle cx="150" cy="260" r="22"/>
  </g>
  <g fill="white" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="150" y="85">C1a</text>
    <text x="150" y="165">C1b</text>
    <text x="150" y="265">C2a</text>
  </g>

  <!-- shifts (single vertices) -->
  <g fill="#b58900" stroke="#7a5c00" stroke-width="2">
    <circle cx="310" cy="80"  r="22"/>
    <circle cx="310" cy="170" r="22"/>
    <circle cx="310" cy="260" r="22"/>
  </g>
  <g fill="white" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="310" y="85">S1</text>
    <text x="310" y="175">S2</text>
    <text x="310" y="265">S3</text>
  </g>

  <text x="230" y="342" text-anchor="middle" font-size="13" fill="#586e75">C2 conflicts with S1, so C2a has no edge to S1</text>
</svg>
