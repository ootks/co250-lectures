<svg xmlns="http://www.w3.org/2000/svg" width="350" height="320" viewBox="0 0 350 320" role="img" aria-labelledby="title desc"><title id="title">Separating hyperplane proof: step 3</title><desc id="desc">For the hypothetical contradiction, the orange polygon reaches a red point whose horizontal projection is left of the blue nearest point. Moving a short distance from the old orange endpoint toward that red point gives a new green endpoint and a shorter green segment. The old distance is dashed gray.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#586e75"/></marker></defs><polygon points="40,110 140,110 140,200 40,200" fill="#268bd2" fill-opacity=".22" stroke="#268bd2" stroke-width="2.5" stroke-linejoin="round"/><polygon points="240,150 320,260 120,245" fill="#cb4b16" fill-opacity=".22" stroke="#cb4b16" stroke-width="2.5" stroke-linejoin="round"/><path d="M140 150L240 150" fill="none" stroke="#93a1a1" stroke-width="3" stroke-dasharray="6 5"/><path d="M240 150L120 245" fill="none" stroke="#cb4b16" stroke-width="3" stroke-dasharray="5 4"/><path d="M140 150L216 169" fill="none" stroke="#859900" stroke-width="3" /><circle cx="140" cy="150" r="6" fill="#859900" stroke="#fdf6e3" stroke-width="2"/><circle cx="240" cy="150" r="6" fill="#859900" stroke="#fdf6e3" stroke-width="2"/><circle cx="120" cy="245" r="6" fill="#dc322f" stroke="#fdf6e3" stroke-width="2"/><circle cx="216" cy="169" r="6" fill="#859900" stroke="#fdf6e3" stroke-width="2"/><path d="M120 245L120 150" fill="none" stroke="#dc322f" stroke-width="3" stroke-dasharray="4 5"/><g font-family="Georgia, serif" font-style="italic" font-size="19" paint-order="stroke" stroke="#fdf6e3" stroke-width="3" stroke-linejoin="round"><text x="119" y="137" fill="#586e75">p</text><text x="244" y="139" fill="#586e75">q</text><text x="93" y="267" fill="#dc322f">q′</text></g></svg>