<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">A diverse collection of polyhedra</title>
  <desc id="desc">Twelve labeled polyhedra arranged in a grid on a transparent background: tetrahedron, cube, octahedron, dodecahedron, icosahedron, triangular prism, pentagonal prism, square pyramid, hexagonal prism, truncated cube, cuboctahedron, and trapezoidal frustum.</desc>
  <style>
    .edge { fill:none; stroke:#24324A; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
    .hidden { fill:none; stroke:#718096; stroke-width:4; stroke-dasharray:10 10; stroke-linejoin:round; }
    .blue { fill:#60A5FA; fill-opacity:.30; stroke:#2563EB; stroke-width:4; stroke-linejoin:round; }
    .purple { fill:#A78BFA; fill-opacity:.30; stroke:#7C3AED; stroke-width:4; stroke-linejoin:round; }
    .green { fill:#4ADE80; fill-opacity:.28; stroke:#16A34A; stroke-width:4; stroke-linejoin:round; }
    .amber { fill:#FBBF24; fill-opacity:.28; stroke:#D97706; stroke-width:4; stroke-linejoin:round; }
    .rose { fill:#FB7185; fill-opacity:.27; stroke:#E11D48; stroke-width:4; stroke-linejoin:round; }
    .cyan { fill:#22D3EE; fill-opacity:.26; stroke:#0891B2; stroke-width:4; stroke-linejoin:round; }
    .label { font-family:Inter,Arial,sans-serif; font-size:27px; font-weight:600; text-anchor:middle; fill:#172033; }
  </style>

  <!-- Row 1: Platonic solids -->
  <g transform="translate(200 190)">
    <polygon class="blue" points="0,-105 -118,92 118,92"/>
    <polygon class="blue" points="0,-105 0,35 -118,92"/>
    <polygon class="blue" points="0,-105 118,92 0,35"/>
    <path class="hidden" d="M-118 92 L0 35 L118 92"/>
    <path class="edge" d="M0 -105 L-118 92 L118 92 Z M0 -105 L0 35"/>
    <text class="label" x="0" y="147">Tetrahedron</text>
  </g>

  <g transform="translate(600 190)">
    <polygon class="purple" points="-105,-55 20,-105 115,-48 -10,3"/>
    <polygon class="purple" points="-105,-55 -10,3 -10,110 -105,52"/>
    <polygon class="purple" points="-10,3 115,-48 115,60 -10,110"/>
    <path class="hidden" d="M-105 52 L20 2 L115 60 M20 -105 L20 2"/>
    <path class="edge" d="M-105 -55 L20 -105 L115 -48 L115 60 L-10 110 L-105 52 Z M-105 -55 L-10 3 L115 -48 M-10 3 L-10 110"/>
    <text class="label" x="0" y="157">Cube</text>
  </g>

  <g transform="translate(1000 190)">
    <polygon class="green" points="0,-120 118,0 0,42"/>
    <polygon class="green" points="0,-120 0,42 -118,0"/>
    <polygon class="green" points="0,120 118,0 0,42"/>
    <polygon class="green" points="0,120 0,42 -118,0"/>
    <path class="hidden" d="M-118 0 L0,-42 L118,0 M0,-120 L0,-42 L0,120"/>
    <path class="edge" d="M0 -120 L118 0 L0 120 L-118 0 Z M0 -120 L0 42 M118 0 L0 42 L-118 0 M0 42 L0 120"/>
    <text class="label" x="0" y="167">Octahedron</text>
  </g>

  <g transform="translate(1400 190)">
    <polygon class="amber" points="0,-118 84,-78 112,12 55,100 -55,100 -112,12 -84,-78"/>
    <polygon class="amber" points="0,-65 62,-35 72,30 34,70 -34,70 -72,30 -62,-35"/>
    <path class="edge" d="M0 -118 L84 -78 L112 12 L55 100 L-55 100 L-112 12 L-84 -78 Z M0 -65 L62 -35 L72 30 L34 70 L-34 70 L-72 30 L-62 -35 Z M0 -118 L0 -65 M84 -78 L62 -35 M112 12 L72 30 M55 100 L34 70 M-55 100 L-34 70 M-112 12 L-72 30 M-84 -78 L-62 -35"/>
    <text class="label" x="0" y="147">Dodecahedron</text>
  </g>

  <!-- Row 2: pointed and prismatic forms -->
  <g transform="translate(200 520)">
    <polygon class="rose" points="0,-120 78,-58 116,25 48,105 -48,105 -116,25 -78,-58"/>
    <path class="edge" d="M0 -120 L78 -58 L116 25 L48 105 L-48 105 L-116 25 L-78 -58 Z M0 -120 L0 48 M78 -58 L0 48 L116 25 M48 105 L0 48 L-48 105 M-116 25 L0 48 L-78 -58"/>
    <path class="hidden" d="M-78 -58 L0 -22 L78 -58 M0 -22 L116 25 M0 -22 L-116 25"/>
    <text class="label" x="0" y="153">Icosahedron</text>
  </g>

  <g transform="translate(600 520)">
    <polygon class="cyan" points="-112,-55 -30,-108 38,-38"/>
    <polygon class="cyan" points="-112,-55 38,-38 112,62 -38,78"/>
    <polygon class="cyan" points="38,-38 -30,-108 45,-8 112,62"/>
    <path class="hidden" d="M-112 -55 L-38 78 L45 -8 L-30 -108 M45 -8 L112 62"/>
    <path class="edge" d="M-112 -55 L-30 -108 L38 -38 L112 62 L-38 78 Z M-112 -55 L38 -38 M-30 -108 L45 -8 L112 62 M45 -8 L-38 78"/>
    <text class="label" x="0" y="153">Triangular prism</text>
  </g>

  <g transform="translate(1000 520)">
    <polygon class="blue" points="-83,-66 -10,-112 80,-82 96,-12 10,20 -84,-12"/>
    <polygon class="blue" points="-84,-12 10,20 92,70 0,108 -92,68"/>
    <polygon class="blue" points="10,20 96,-12 104,42 92,70 0,108"/>
    <path class="hidden" d="M-83 -66 L-92 68 M-10 -112 L0 -58 M80 -82 L88 -30"/>
    <path class="edge" d="M-83 -66 L-10 -112 L80 -82 L96 -12 L10 20 L-84 -12 Z M-84 -12 L-92 68 L0 108 L92 70 L104 42 L96 -12 M10 20 L0 108"/>
    <text class="label" x="0" y="153">Pentagonal prism</text>
  </g>

  <g transform="translate(1400 520)">
    <polygon class="purple" points="0,-125 -120,48 0,112"/>
    <polygon class="purple" points="0,-125 0,112 120,48"/>
    <polygon class="purple" points="0,-125 120,48 20,5"/>
    <path class="hidden" d="M-120 48 L20 5 L120 48 M20 5 L0 112"/>
    <path class="edge" d="M0 -125 L-120 48 L0 112 L120 48 Z M0 -125 L0 112"/>
    <text class="label" x="0" y="158">Square pyramid</text>
  </g>

  <!-- Row 3: further combinatorial types -->
  <g transform="translate(200 850)">
    <polygon class="green" points="-94,-64 -25,-104 58,-84 102,-24 54,18 -32,12 -94,-20"/>
    <polygon class="green" points="-94,-20 -32,12 52,62 -28,105 -103,70"/>
    <polygon class="green" points="54,18 102,-24 104,30 52,62 -28,105"/>
    <path class="hidden" d="M-94 -64 L-103 70 M-25 -104 L-28 -48 M58 -84 L59 -30"/>
    <path class="edge" d="M-94 -64 L-25 -104 L58 -84 L102 -24 L54 18 L-32 12 L-94 -20 Z M-94 -20 L-103 70 L-28 105 L52 62 L104 30 L102 -24 M-32 12 L-28 105 M54 18 L52 62"/>
    <text class="label" x="0" y="153">Hexagonal prism</text>
  </g>

  <g transform="translate(600 850)">
    <polygon class="amber" points="-75,-82 5,-113 79,-70 103,-25 76,5 -6,38 -83,-7 -106,-50"/>
    <polygon class="amber" points="-83,-7 -6,38 -7,101 -80,58 -106,20 -106,-50"/>
    <polygon class="amber" points="-6,38 76,5 105,20 103,58 74,84 -7,101"/>
    <path class="hidden" d="M5 -113 L6 -50 M79 -70 L70 -32 M103 -25 L76 5"/>
    <path class="edge" d="M-75 -82 L5 -113 L79 -70 L103 -25 L76 5 L-6 38 L-83 -7 L-106 -50 Z M-83 -7 L-106 20 L-80 58 L-7 101 L74 84 L103 58 L105 20 L103 -25 M-6 38 L-7 101"/>
    <text class="label" x="0" y="153">Truncated cube</text>
  </g>

  <g transform="translate(1000 850)">
    <polygon class="rose" points="0,-116 78,-76 112,0 78,76 0,116 -78,76 -112,0 -78,-76"/>
    <polygon class="rose" points="0,-45 46,-23 52,30 0,55 -52,30 -46,-23"/>
    <path class="edge" d="M0 -116 L78 -76 L112 0 L78 76 L0 116 L-78 76 L-112 0 L-78 -76 Z M0 -45 L46 -23 L52 30 L0 55 L-52 30 L-46 -23 Z M0 -116 L0 -45 M78 -76 L46 -23 M112 0 L52 30 M78 76 L52 30 M0 116 L0 55 M-78 76 L-52 30 M-112 0 L-52 30 M-78 -76 L-46 -23"/>
    <text class="label" x="0" y="153">Cuboctahedron</text>
  </g>

  <g transform="translate(1400 850)">
    <polygon class="cyan" points="-58,-91 30,-118 91,-80 3,-52"/>
    <polygon class="cyan" points="-58,-91 3,-52 112,43 -48,98 -116,48"/>
    <polygon class="cyan" points="3,-52 91,-80 119,-27 112,43"/>
    <path class="hidden" d="M-116 48 L44 0 L119 -27 M44 0 L30 -118"/>
    <path class="edge" d="M-58 -91 L30 -118 L91 -80 L119 -27 L112 43 L-48 98 L-116 48 Z M-58 -91 L3 -52 L91 -80 M3 -52 L112 43"/>
    <text class="label" x="0" y="153">Trapezoidal frustum</text>
  </g>
</svg>
