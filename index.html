<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lecture slides for CO 250: Introduction to Optimization">
  <title>Introduction to Optimization — CO 250</title>
  <style>
    :root {
      --base03: #002b36;
      --base02: #073642;
      --base01: #586e75;
      --base00: #657b83;
      --base0:  #839496;
      --base1:  #93a1a1;
      --base2:  #eee8d5;
      --base3:  #fdf6e3;
      --yellow: #b58900;
      --orange: #cb4b16;
      --red:    #dc322f;
      --magenta:#d33682;
      --violet: #6c71c4;
      --blue:   #268bd2;
      --cyan:   #2aa198;
      --green:  #859900;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--base3);
      color: var(--base00);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    main {
      width: min(92%, 760px);
      margin: 0 auto;
      padding: 5rem 0;
    }

    header {
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--base2);
    }

    h1 {
      margin: 0;
      color: var(--base02);
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    h2 {
      margin: 0.7rem 0 0;
      color: var(--orange);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    nav h3 {
      margin: 0 0 1rem;
      color: var(--base01);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--base2);
    }

    li {
      border-bottom: 1px solid var(--base2);
    }

    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0.25rem;
      color: var(--blue);
      font-size: 1.1rem;
      text-decoration: none;
      transition: color 150ms ease, padding 150ms ease, background 150ms ease;
    }

    a::after {
      content: "\2192";
      color: var(--base1);
      transition: transform 150ms ease, color 150ms ease;
    }

    a:hover,
    a:focus-visible {
      padding-left: 0.75rem;
      padding-right: 0.75rem;
      background: var(--base2);
      color: var(--orange);
      outline: none;
    }

    a:hover::after,
    a:focus-visible::after {
      color: var(--orange);
      transform: translateX(0.25rem);
    }

  </style>
</head>
<body>
  <main>
    <header>
      <h1>Introduction to Optimization</h1>
      <h2>CO 250</h2>
    </header>

    <nav aria-labelledby="lectures-heading">
      <h3 id="lectures-heading">Lecture slides</h3>
      <ul>
        <!-- Replace each href and label with the corresponding lecture file and title. -->
        <li><a href="lecture1.html">Lecture 1</a></li>
        <li><a href="lecture2.html">Lecture 2</a></li>
        <li><a href="lecture3.html">Lecture 3</a></li>
        <!--<li><a href="lecture4.html">Lecture 4</a></li>-->
        <!--<li><a href="lecture5.html">Lecture 5</a></li>-->
        <!--<li><a href="lecture6.html">Lecture 6</a></li>-->
        <!--<li><a href="lecture7.html">Lecture 7</a></li>-->
        <!--<li><a href="lecture8.html">Lecture 8</a></li>-->
        <!--<li><a href="lecture9.html">Lecture 9</a></li>-->
      </ul>
    </nav>
  </main>
</body>
</html>
